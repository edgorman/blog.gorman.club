name: 'Terraform Pull Request'
description: 'Performs terraform init and plan, and posts the plan on the pull request'

inputs:
  terraform_directory:
    description: 'The directory containing the Terraform files'
    required: true
  config_directory:
    description: 'The directory containing the configuration files (backend and vars)'
    required: true
  github_token:
    description: 'GitHub token for posting comments'
    required: true
  pull_request_number:
    description: 'Pull request to post the plan on, for a run that is not itself a pull_request event (the release PR''s prod plan). Omit to comment on the triggering pull request.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # TF_VAR_* values come from the calling step's `env:`.
    # The version comes from .prototools.
    - id: terraform-version
      name: Read the Terraform version
      shell: bash
      run: echo "version=$(sed -n 's/^terraform = "\([^"]*\)".*/\1/p' .prototools | head -1)" >> "$GITHUB_OUTPUT"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      run: |
        terraform init \
          -backend-config="${{ github.workspace }}/${{ inputs.config_directory }}/terraform.tfbackend"

    # Formatting and validation are the `lint-check` job's (moon's :format and :validate), and
    # plan validates the configuration again.
    - name: Terraform Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      run: |
        terraform plan \
          -var-file="${{ github.workspace }}/${{ inputs.config_directory }}/terraform.tfvars" \
          -refresh=false \
          -lock=false \
          -no-color \
          -input=false \
          -out=tfplan.binary
        terraform show -no-color tfplan.binary > tfplan.txt

    - name: Post Terraform Plan Comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');
          const path = require('path');

          // GitHub's comment size limit, with room for the formatting below.
          const MAX_COMMENT_LENGTH = 65000;

          const environmentName = path.basename('${{ inputs.config_directory }}');
          const planPath = path.join('${{ github.workspace }}', '${{ inputs.terraform_directory }}', 'tfplan.txt');
          const plan = fs.readFileSync(planPath, 'utf8');
          const truncatedPlan = plan.length > MAX_COMMENT_LENGTH
            ? plan.substring(0, MAX_COMMENT_LENGTH) + '\n\n... (output truncated due to length)'
            : plan;

          const output = `### Terraform Plan for \`${environmentName}\` Environment

          <details>
          <summary>Show Plan</summary>

          \`\`\`hcl
          ${truncatedPlan}
          \`\`\`

          </details>

          *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ inputs.terraform_directory }}\`, Workflow: \`${{ github.workflow }}\`*`;

          await github.rest.issues.createComment({
            issue_number: Number('${{ inputs.pull_request_number }}') || context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });
