name: 'Push Release'

# A release-please release commit on main: the merge of its release PR, which changes only the files
# release-please owns. push-commit.yaml skips such a push. Nothing deployable changed, so this
# publishes the previous commit's artifacts under the release commit (promotion deploys by commit
# SHA, decision 22), tags the release, and promotes it to production (decision 39). It does not
# deploy to staging, which already runs the same code, unless an artifact is missing and has to be
# built, which also deploys it there.
on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
      - '.github/.release-please-manifest.json'
      - '.github/version.txt'

permissions:
  contents: read

# Its own group, so a later push-commit.yaml run can never supersede a release that is waiting.
concurrency:
  group: push-release-main
  cancel-in-progress: false

jobs:
  # One leg per artifact, run in parallel. The previous commit's artifact is tagged (or, for the
  # frontend, copied) under this commit in both environments. If it is missing, because that run
  # was cancelled or aged out, the leg builds it from this commit, which has the same code.
  artifacts:
    name: artifacts-${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [backend, worker, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Signed in once for every step below, including the composite actions.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - if: matrix.service != 'frontend'
        uses: ./.github/actions/backend-deploy
        with:
          image_name: ${{ matrix.service }}
          image_tag: ${{ github.sha }}
          reuse_from: ${{ github.event.before }}
      - if: matrix.service == 'frontend'
        uses: ./.github/actions/frontend-artifact
        with:
          reuse_from: ${{ github.event.before }}
          google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}

  # Creates the tag and the GitHub release. It waits on the artifacts (the default `if` runs it only
  # when every leg succeeded), so a tag always has the commit-SHA artifacts promotion deploys.
  release-please:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The same token as push-commit.yaml's release-please job (decision 39).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            release_please_token: projects/blog-gorman-club-root/secrets/github_provider_token/versions/latest
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.secrets.outputs.release_please_token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Deploys the release to production from the artifacts already in prod's stores (decision 39);
  # rollback is promote-release.yaml run by hand.
  promote:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/promote-release.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ github.sha }}
