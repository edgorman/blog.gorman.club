name: 'Backend Cloud Run Deploy'
description: 'Deploys a backend image to Cloud Run and returns its URL'

inputs:
  gcp_project_id:
    description: 'GCP project the Cloud Run service lives in'
    required: true
  gcp_region:
    description: 'GCP region of the Cloud Run service'
    required: true
  service_name:
    description: 'Cloud Run service name'
    required: true
  image:
    description: 'Full image reference to deploy'
    required: true

outputs:
  backend_url:
    description: 'Public URL of the deployed Cloud Run service'
    value: ${{ steps.url.outputs.backend_url }}

runs:
  using: "composite"
  steps:
    # A release whose image is already live (an unchanged backend re-tagged on merge, decision 33)
    # has nothing to deploy. A missing service or image reads as different, so it deploys.
    - id: live
      name: Compare With Live Revision
      shell: bash
      env:
        SERVICE: ${{ inputs.service_name }}
        REGION: ${{ inputs.gcp_region }}
        PROJECT: ${{ inputs.gcp_project_id }}
        IMAGE: ${{ inputs.image }}
      run: |
        rev=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" \
          --format='value(status.latestReadyRevisionName)' 2>/dev/null) || true
        live=$(gcloud run revisions describe "$rev" --region="$REGION" --project="$PROJECT" \
          --format='value(status.imageDigest)' 2>/dev/null) || true
        want=$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)' 2>/dev/null) || true
        if [ -n "$want" ] && [ "${live##*@}" = "$want" ]; then
          echo "$SERVICE already runs $want; skipping the deploy."
          echo 'current=true' >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy to Cloud Run
      if: steps.live.outputs.current != 'true'
      shell: bash
      run: |
        gcloud run deploy "${{ inputs.service_name }}" \
          --image="${{ inputs.image }}" \
          --region="${{ inputs.gcp_region }}" \
          --project="${{ inputs.gcp_project_id }}" \
          --quiet

    - id: url
      name: Get Backend URL
      shell: bash
      run: |
        URL=$(gcloud run services describe "${{ inputs.service_name }}" \
          --region="${{ inputs.gcp_region }}" \
          --project="${{ inputs.gcp_project_id }}" \
          --format='value(status.url)')
        echo "backend_url=$URL" >> "$GITHUB_OUTPUT"
