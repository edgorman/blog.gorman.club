name: 'Terraform Pull Request'
description: 'Performs terraform init and plan, and posts the plan on the pull request'

inputs:
  terraform_directory:
    description: 'The directory containing the Terraform files'
    required: true
  config_directory:
    description: 'The directory containing the configuration files (backend and vars)'
    required: true
  github_token:
    description: 'GitHub token for posting comments'
    required: true
  pull_request_number:
    description: 'Pull request to post the plan on, for a run that is not itself a pull_request event (the release PR''s prod plan). Omit to comment on the triggering pull request.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # TF_VAR_* values come from the calling step's `env:`.
    # The version comes from .prototools.
    - id: terraform-version
      name: Read the Terraform version
      shell: bash
      run: echo "version=$(sed -n 's/^terraform = "\([^"]*\)".*/\1/p' .prototools | head -1)" >> "$GITHUB_OUTPUT"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      run: |
        terraform init \
          -backend-config="${{ github.workspace }}/${{ inputs.config_directory }}/terraform.tfbackend"

    # Formatting and validation are the `lint-check` job's (moon's :format and :validate), and
    # plan validates the configuration again.
    - name: Terraform Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      run: |
        terraform plan \
          -var-file="${{ github.workspace }}/${{ inputs.config_directory }}/terraform.tfvars" \
          -refresh=false \
          -lock=false \
          -no-color \
          -input=false \
          -out=tfplan.binary
        terraform show -no-color tfplan.binary > tfplan.txt

    # One comment per environment, updated on each push. The plan is cut to fit GitHub's comment limit.
    - id: comment
      name: Format Terraform Plan Comment
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      env:
        CONFIG_DIRECTORY: ${{ inputs.config_directory }}
        TERRAFORM_DIRECTORY: ${{ inputs.terraform_directory }}
        ACTOR: ${{ github.actor }}
        EVENT_NAME: ${{ github.event_name }}
        WORKFLOW: ${{ github.workflow }}
      run: |
        environment="$(basename "$CONFIG_DIRECTORY")"
        {
          echo "### Terraform Plan for \`$environment\` Environment"
          echo
          echo '<details>'
          echo '<summary>Show Plan</summary>'
          echo
          echo '```hcl'
          head -c 60000 tfplan.txt
          if [ "$(wc -c < tfplan.txt)" -gt 60000 ]; then printf '\n\n... (output truncated due to length)\n'; fi
          echo '```'
          echo
          echo '</details>'
          echo
          echo "*Pusher: @$ACTOR, Action: \`$EVENT_NAME\`, Working Directory: \`$TERRAFORM_DIRECTORY\`, Workflow: \`$WORKFLOW\`*"
        } > "$RUNNER_TEMP/plan-comment-$environment.md"
        echo "environment=$environment" >> "$GITHUB_OUTPUT"
        echo "path=$RUNNER_TEMP/plan-comment-$environment.md" >> "$GITHUB_OUTPUT"

    - name: Post Terraform Plan Comment
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: terraform-${{ steps.comment.outputs.environment }}
        path: ${{ steps.comment.outputs.path }}
        number: ${{ inputs.pull_request_number }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
