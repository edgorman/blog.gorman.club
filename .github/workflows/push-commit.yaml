name: 'Push Commit'

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: push-commit-root-main
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.diff.outputs.infrastructure-root }}
      services-frontend: ${{ steps.diff.outputs.services-frontend }}
      services-backend: ${{ steps.diff.outputs.services-backend }}
      infrastructure-staging: ${{ steps.diff.outputs.infrastructure-staging }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        uses: ./.github/actions/github-file-diff
        with:
          branch_ref: ${{ github.ref_name }}

  # Builds the frontend image once, tagged with the commit SHA and `latest`, pushes it to staging
  # Artifact Registry, then deploys those exact static files to Cloudflare Pages - one build feeds
  # both, so the live staging site is never rebuilt separately from the stored image.
  services-frontend:
    needs: [diff, infrastructure-root, infrastructure-staging, services-backend]
    if: |
      always() &&
      needs.diff.outputs.services-frontend == 'true' &&
      needs.diff.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped') &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped') &&
      (needs.services-backend.result == 'success' || needs.services-backend.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
            CLOUDFLARE_ACCOUNT_ID=cloudflare_account_id
      # Reuses gcp-secret-manager's WIF auth/Cloud SDK setup rather than authenticating again.
      # Looked up directly since services-backend's output is unavailable when that job is
      # skipped; falls back to empty if the service doesn't exist yet.
      - id: backend
        name: Get Backend URL
        shell: bash
        run: |
          URL=$(gcloud run services describe backend-stag \
            --region=europe-west1 \
            --project=blog-gorman-club-stag \
            --format='value(status.url)' 2>/dev/null || true)
          echo "backend_url=$URL" >> "$GITHUB_OUTPUT"
      # Base64-encoded so the JSON (with its embedded quotes) can pass through a build-arg safely;
      # the frontend decodes it with atob(). Not a secret - Firebase web config is meant to ship in
      # the client bundle, access control lives in firestore.rules instead.
      - id: firebase
        name: Get Firebase Web Config
        shell: bash
        run: |
          TOKEN=$(gcloud auth print-access-token)
          APP_NAME=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Goog-User-Project: blog-gorman-club-stag" \
            "https://firebase.googleapis.com/v1beta1/projects/blog-gorman-club-stag/webApps" \
            2>/dev/null | jq -r '.apps[0].name // empty') || true
          CONFIG_B64=""
          if [ -n "$APP_NAME" ]; then
            CONFIG_B64=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-Goog-User-Project: blog-gorman-club-stag" \
              "https://firebase.googleapis.com/v1beta1/${APP_NAME}/config" \
              2>/dev/null | base64 -w0) || true
          fi
          echo "config=$CONFIG_B64" >> "$GITHUB_OUTPUT"
      - id: image
        uses: ./.github/actions/frontend-image-build
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          gcp_region: 'europe-west1'
          image_tag: ${{ github.sha }}
          backend_url: ${{ steps.backend.outputs.backend_url }}
          firebase_config: ${{ steps.firebase.outputs.config }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-image-extract
        with:
          image_ref: ${{ steps.image.outputs.image_ref }}
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: 'frontend-stag'

  infrastructure-root:
    needs: diff
    if: needs.diff.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
            TF_VAR_cloudflare_account_id=cloudflare_account_id
            TF_VAR_cloudflare_api_token=cloudflare_api_token
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}

  # Provisions the backend's Artifact Registry + Cloud Run for staging. No sensitive vars,
  # so it authenticates directly (no gcp-secret-manager). Waits on infrastructure-root so any
  # new IAM grants or baseline API enablement it applies land before this project is touched.
  infrastructure-staging:
    needs: [diff, infrastructure-root]
    if: |
      always() &&
      needs.diff.outputs.infrastructure-staging == 'true' &&
      needs.diff.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/staging'

  # Builds and deploys the backend image to staging, tagged with the commit SHA. Must follow
  # infrastructure-staging so the target resources exist.
  services-backend:
    needs: [diff, infrastructure-staging]
    if: |
      always() &&
      needs.diff.outputs.services-backend == 'true' &&
      needs.diff.result == 'success' &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-deploy
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          gcp_region: 'europe-west1'
          service_name: 'backend-stag'
          image_tag: ${{ github.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

  # Runs unconditionally on every merge; the patch-bump pre-release isn't gated on which part
  # of the repo changed. Drafts the release body from commit messages since the last tag, then
  # appends a read-only prod terraform plan so a reviewer can see infra impact before promoting.
  #
  # gren (github-release-notes) was tried here instead of the git-log summary below, but proved
  # unreliable in this repo: its single-tag "use the previous tag" auto-detection pulled in the
  # full commit history instead of just the commits since the last tag, and passing an explicit
  # <new>..<old> range silently overwrote the *old* tag's release instead of creating the new
  # one. Reverted to the deterministic git-log approach.
  pre-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Calculate Next Version
        shell: bash
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          {
            echo "version=v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "last_tag=$LAST_TAG"
          } >> "$GITHUB_OUTPUT"

      - id: commits
        name: Summarize Commits Since Last Release
        shell: bash
        run: |
          if git rev-parse "${{ steps.version.outputs.last_tag }}" >/dev/null 2>&1; then
            RANGE="${{ steps.version.outputs.last_tag }}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo 'log<<COMMITS_EOF'
            git log "$RANGE" --pretty='- %s (%h)'
            echo 'COMMITS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Terraform Plan (prod preview)
        shell: bash
        working-directory: infrastructure/env
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/infrastructure/config/prod/terraform.tfbackend"
          terraform plan \
            -var-file="${{ github.workspace }}/infrastructure/config/prod/terraform.tfvars" \
            -lock=false \
            -no-color \
            -input=false \
            -out=tfplan.binary
          terraform show -no-color tfplan.binary > tfplan.txt

      - name: Write Release Notes
        shell: bash
        run: |
          {
            echo "## Commits since ${{ steps.version.outputs.last_tag }}"
            echo "${{ steps.commits.outputs.log }}"
            echo
            echo "### Terraform Plan for \`prod\` Environment"
            echo
            echo "<details>"
            echo "<summary>Show Plan</summary>"
            echo
            echo '```hcl'
            cat infrastructure/env/tfplan.txt
            echo '```'
            echo
            echo "</details>"
          } > RELEASE_NOTES.md

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: RELEASE_NOTES.md
