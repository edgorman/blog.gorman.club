name: 'Push Commit'

# Every push to main except a release-please release commit, which push-release.yaml handles. A
# release commit changes only the files release-please owns, and a push that changes only those is
# the one `paths-ignore` skips; a push that also changes anything else runs both files.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - '.github/.release-please-manifest.json'
      - '.github/version.txt'

permissions:
  contents: read

concurrency:
  group: push-commit-root-main
  cancel-in-progress: false

jobs:
  # moon decides which Terraform deployments an apply reaches, as pull-request.yaml's `changed` job
  # decides which to plan. The publish markers decide which of the backend, worker and frontend are
  # rebuilt; the rest reuse base_sha's artifacts (decision 33).
  changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      infrastructure-root: ${{ steps.moon.outputs.root }}
      infrastructure-staging: ${{ steps.moon.outputs.staging }}
      backend: ${{ steps.moon.outputs.backend }}
      worker: ${{ steps.moon.outputs.worker }}
      frontend: ${{ steps.moon.outputs.frontend }}
      base_sha: ${{ steps.moon.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      # Only moon, not the toolchain it would run tasks with (see pull-request.yaml's `changed` job).
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: false
          # The toolchain cache is disabled (see pull-request.yaml's `changed` step).
          cache: false
      - id: moon
        name: Compute moon-affected deployments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # A query runs no task, so moon needs none of the pinned tools (see pull-request.yaml).
          MOON_TOOLCHAIN_FORCE_GLOBALS: 'true'
          MOON_SKIP_SETUP_TOOLCHAIN: 'true'
          GOTOOLCHAIN: local
        run: |
          # Diffed against the last commit this workflow fully processed (decision 41): the
          # previous commit when its own run succeeded, else the newest release tag before this
          # commit. So a merge builds and applies only what it changes, not everything since the last
          # release. A cancelled or failed run is never the base, so its work is redone. HEAD~1 is
          # the diff end, so a re-run of a tagged commit sees its own changes. moon reads MOON_BASE
          # as `moon ci` does. With no base, every deployment is marked affected.
          base=
          prev=$(git rev-parse HEAD~1)
          if [ "$(gh run list --workflow push-commit.yaml --branch main --commit "$prev" --status success --json databaseId --jq length)" -gt 0 ]; then
            base=$prev
          else
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD~1 2>/dev/null || true)
          fi
          if [ -n "$base" ]; then
            echo "Diffing against $base"
            export MOON_BASE="$base"
            echo "base_sha=$(git rev-list -n 1 "$base")" >> "$GITHUB_OUTPUT"
          else
            printf '%s=true\n' root staging backend worker frontend >> "$GITHUB_OUTPUT"
            exit 0
          fi
          moon query affected > "$RUNNER_TEMP/affected.json"
          for pair in root=deploy-root:apply staging=deploy-staging:apply backend=services/backend:publish \
            worker=worker:publish frontend=services/frontend:publish; do
            # .tasks is omitted when nothing is affected, so `(.tasks // {})` handles null.
            val=$(jq -r --arg t "${pair#*=}" '(.tasks // {}) | has($t)' "$RUNNER_TEMP/affected.json")
            echo "${pair%%=*}=$val" >> "$GITHUB_OUTPUT"
          done

  infrastructure-root:
    needs: changed
    if: needs.changed.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            github_provider_token: projects/blog-gorman-club-root/secrets/github_provider_token/versions/latest
            cloudflare_api_token: projects/blog-gorman-club-root/secrets/cloudflare_api_token/versions/latest
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
        env:
          TF_VAR_github_provider_token: ${{ steps.secrets.outputs.github_provider_token }}
          TF_VAR_cloudflare_api_token: ${{ steps.secrets.outputs.cloudflare_api_token }}

  # Waits on infrastructure-root so any IAM grants or API enablement it applies land first.
  infrastructure-staging:
    needs: [changed, infrastructure-root]
    if: |
      always() &&
      needs.changed.outputs.infrastructure-staging == 'true' &&
      needs.changed.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/staging'
        env:
          # One client ID, defined in infrastructure/root, serves every environment.
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_ci_service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

  # Runs on every merge, so every commit on `main` has a commit-SHA artifact in both environments, one
  # matrix leg each, run in parallel after infrastructure-root and -staging (a skipped one counts as
  # passing, as it isn't affected). The legs run independently, and smoke and release-please wait for
  # all three.
  # - backend and worker: an unaffected image is base_sha's re-tagged, with no build and no staging
  #   deploy. Both are built from the same Dockerfile with CMD=<image>.
  # - frontend: builds when affected; otherwise it publishes base_sha's folder again under this commit
  #   (or builds, if that folder has aged out). It deploys either way, so staging shows this commit.
  #   One folder feeds both buckets and the Worker. Its steps are in the frontend-staging action.
  services:
    name: services-${{ matrix.service }}
    needs: [changed, infrastructure-root, infrastructure-staging]
    if: |
      always() &&
      needs.changed.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped') &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        service: [backend, worker, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Signed in once for every step below, including the composite actions.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - if: matrix.service != 'frontend'
        uses: ./.github/actions/backend-deploy
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          prod_project_id: 'blog-gorman-club-prod'
          gcp_region: 'europe-west1'
          service_name: '${{ matrix.service }}-stag'
          image_name: ${{ matrix.service }}
          image_tag: ${{ github.sha }}
          reuse_from: ${{ needs.changed.outputs[matrix.service] != 'true' && needs.changed.outputs.base_sha || '' }}
      - if: matrix.service == 'frontend'
        uses: ./.github/actions/frontend-staging
        with:
          reuse_from: ${{ needs.changed.outputs.frontend != 'true' && needs.changed.outputs.base_sha || '' }}
          google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Skipped when this merge changes nothing deployable: the staging site is then the one the last
  # smoke test passed. The deployed frontend and backend together, signed out and read-only, against the live
  # staging site. Covers config.json, CORS, the Worker and routing. Runs once both are live;
  # release-please waits on it.
  smoke:
    needs: [changed, services]
    if: |
      always() &&
      needs.services.result == 'success' &&
      (needs.changed.outputs.infrastructure-root == 'true' ||
        needs.changed.outputs.infrastructure-staging == 'true' ||
        needs.changed.outputs.backend == 'true' ||
        needs.changed.outputs.worker == 'true' ||
        needs.changed.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # Opens or updates the release PR, so it lists this commit. Tagging the release is
  # push-release.yaml's job, on the release PR's own merge (decision 39). It waits on this commit's
  # deploy and smoke test. `if:` tests each direct need for `success` (smoke may also be skipped,
  # when nothing deployable changed), since always() opts out of inherited skips. A skip of any
  # publish job is not release-worthy.
  release-please:
    needs: [services, smoke]
    if: |
      always() &&
      (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') &&
      needs.services.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      pr_number: ${{ steps.release.outputs.prs_created == 'true' && fromJSON(steps.release.outputs.pr).number || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The PAT, so the release PR triggers the PR checks (decision 39).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            release_please_token: projects/blog-gorman-club-root/secrets/github_provider_token/versions/latest
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.secrets.outputs.release_please_token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # The prod plan for the open release PR, so a reviewer sees what merging will apply (decision 37).
  plan-prod:
    needs: release-please
    if: needs.release-please.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pull_request_number: ${{ needs.release-please.outputs.pr_number }}
        env:
          # Passed as in every prod plan and apply.
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_ci_service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}
