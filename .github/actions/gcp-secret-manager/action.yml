name: 'GCP Secret Manager'
description: 'Reads secrets from GCP Secret Manager and outputs them in a format suitable for the Terraform actions'

inputs:
  project_id:
    description: 'The GCP Project ID'
    required: true
  workload_identity_provider:
    description: 'The Workload Identity Provider resource name'
    required: true
  service_account:
    description: 'The Google Service Account email'
    required: true
  secrets_list:
    description: 'A newline-separated list of mapping between ENV_VAR and Secret name (e.g. DB_PASSWORD=database-pwd)'
    required: false
    default: ''
  optional_secrets_list:
    description: 'Same format as secrets_list, for secrets that may not exist yet. A name that does not resolve is skipped instead of failing the run.'
    required: false
    default: ''

outputs:
  secrets:
    description: 'Newline-separated list of secrets in KEY=VALUE format'
    value: ${{ steps.fetch-secrets.outputs.formatted_secrets }}

runs:
  using: 'composite'
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

    # Inputs arrive through the environment rather than as ${{ }} substitutions into the script:
    # an expression is pasted into the source text before bash parses it, so a value carrying a
    # quote or a $(...) would be executed rather than read. Through the environment it stays data.
    - id: fetch-secrets
      name: Fetch Secrets
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.project_id }}
        SECRETS_LIST: ${{ inputs.secrets_list }}
        OPTIONAL_SECRETS_LIST: ${{ inputs.optional_secrets_list }}
      run: |
        RESULT=()
        # Each line is ENV_VAR=SECRET_NAME.
        while IFS='=' read -r KEY SECRET_NAME; do
          [ -n "$KEY" ] || continue

          echo "Fetching secret: $SECRET_NAME for $KEY"
          VALUE=$(gcloud secrets versions access latest --secret="$SECRET_NAME" --project="$PROJECT_ID")

          # GitHub only auto-masks the `secrets:` context, so mask before the value is echoed anywhere.
          echo "::add-mask::$VALUE"
          RESULT+=("$KEY=$VALUE")
        done <<< "$SECRETS_LIST"

        # Optional secrets are skipped when they do not resolve, which is what lets a secret and
        # the workflow reading it land in one commit: on the pull request the secret does not exist
        # yet, and only the apply that follows the merge creates it. The consumer sees no value at
        # all rather than an empty one, so it falls back to its own default.
        while IFS='=' read -r KEY SECRET_NAME; do
          [ -n "$KEY" ] || continue

          echo "Fetching optional secret: $SECRET_NAME for $KEY"
          if ! VALUE=$(gcloud secrets versions access latest --secret="$SECRET_NAME" --project="$PROJECT_ID" 2>/dev/null); then
            echo "Optional secret $SECRET_NAME does not exist yet; leaving $KEY unset"
            continue
          fi

          echo "::add-mask::$VALUE"
          RESULT+=("$KEY=$VALUE")
        done <<< "$OPTIONAL_SECRETS_LIST"

        # The heredoc delimiter is randomized per run because the values between the markers are
        # secrets this step has never seen before: a fixed marker is one a value could contain,
        # which would end the block early and let the rest be read as further outputs.
        DELIMITER="SECRETS_EOF_$(openssl rand -hex 16)"
        {
          echo "formatted_secrets<<$DELIMITER"
          if [ ${#RESULT[@]} -gt 0 ]; then printf '%s\n' "${RESULT[@]}"; fi
          echo "$DELIMITER"
        } >> "$GITHUB_OUTPUT"
