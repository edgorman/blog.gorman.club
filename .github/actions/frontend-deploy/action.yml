name: 'Frontend Deploy'
description: 'Deploys an already-built frontend, with its Worker, to Cloudflare Workers'

inputs:
  cloudflare_api_token:
    description: 'Cloudflare API token, read from Secret Manager by the calling job'
    required: true
  cloudflare_account_id:
    description: 'The Cloudflare account id, the CLOUDFLARE_ACCOUNT_ID repository variable. Not a secret.'
    required: true
  cloudflare_project_name:
    description: 'Name of the Cloudflare Worker to deploy to'
    required: true
  dist_directory:
    description: 'Directory of already-built static files to deploy, relative to services/frontend'
    required: false
    default: 'dist'
  backend_url:
    description: 'Base URL of the backend service, written into config.json for the app to read at runtime (see Production Releases in .github/AGENTS.md). Omit to deploy the build unmodified.'
    required: false
    default: ''
  version:
    description: 'Release tag written into config.json for the app to display and link to its GitHub release (see .github/AGENTS.md) - on staging the short commit SHA (staging runs a commit, not a release), on production the tag actually promoted. Omit to leave it out of config.json.'
    required: false
    default: ''
  environment:
    description: 'Environment name written into config.json - "staging" or "production" (see .github/AGENTS.md). Omit to leave it out of config.json.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    # Written next to the static files, so one build serves any environment (see
    # src/lib/config.ts). Empty inputs are omitted, as src/lib/config.ts treats a missing field and
    # an empty one alike.
    - name: Write Runtime Config
      if: inputs.backend_url != '' || inputs.version != '' || inputs.environment != ''
      shell: bash
      env:
        BACKEND_URL: ${{ inputs.backend_url }}
        VERSION: ${{ inputs.version }}
        ENVIRONMENT: ${{ inputs.environment }}
        CONFIG_PATH: services/frontend/${{ inputs.dist_directory }}/config.json
      run: |
        jq -n \
          --arg backendUrl "$BACKEND_URL" \
          --arg version "$VERSION" \
          --arg environment "$ENVIRONMENT" \
          '{backendUrl: $backendUrl, version: $version, environment: $environment} | with_entries(select(.value != ""))' \
          > "$CONFIG_PATH"

    # `--name` names the Worker Terraform created for this environment; wrangler.jsonc carries a
    # placeholder name.
    - name: Deploy to Cloudflare Workers
      uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
      with:
        apiToken: ${{ inputs.cloudflare_api_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        workingDirectory: services/frontend
        # renovate: datasource=npm depName=wrangler
        wranglerVersion: '4.164.0'
        command: deploy --name ${{ inputs.cloudflare_project_name }} --assets ${{ inputs.dist_directory }}
