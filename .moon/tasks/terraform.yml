$schema: '../cache/schemas/tasks.json'

# v2 config-based inheritance (v1's filename-based tasks/<lang>-<type>.yml no longer applies):
# every project tagged 'terraform' (infra-root, infra-env) picks these up without repeating them.
inheritedBy:
  tags: ['terraform']

tasks:
  format:
    command: 'terraform fmt -check'
  validate:
    script: 'terraform init -backend=false -input=false && terraform validate'
    options:
      cache: false        # init writes .terraform/, which is gitignored
      # registry.terraform.io isn't in a Claude Code cloud session's default network allowlist
      # (see AGENTS.md) - confirmed locally: `terraform init` fails with a 403 fetching the
      # provider discovery document. Runs in CI only until that's addressed.
      runInCI: 'only'
