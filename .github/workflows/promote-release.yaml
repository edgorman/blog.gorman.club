name: 'Promote Release'

# "released" fires both for a plain publish and when an existing pre-release
# is converted into a formal release - the manual-promotion trigger CLAUDE.md
# describes.
on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: promote-release-prod
  cancel-in-progress: false

env:
  GCP_REGION: europe-west1
  STAG_PROJECT: blog-gorman-club-stag
  PROD_PROJECT: blog-gorman-club-prod
  BACKEND_IMAGE: backend/backend

jobs:
  # Resolves the commit the release tag actually points at, rather than
  # trusting github.sha (which for a release event is the default branch
  # tip, not necessarily the tagged commit).
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  terraform-apply-prod:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure'
          config_directory: 'infrastructure/config/prod'

  # Copies the exact image bytes already validated in staging by digest -
  # images are never rebuilt for production. Re-promoting a previous
  # release tag (rollback) is a safe no-op here since that digest already
  # exists at the destination tag.
  promote-image:
    needs: [resolve, terraform-apply-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.vars.outputs.dest }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        shell: bash
        run: |
          {
            echo "source=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.STAG_PROJECT }}/${{ env.BACKEND_IMAGE }}:${{ needs.resolve.outputs.sha }}"
            echo "dest=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROD_PROJECT }}/${{ env.BACKEND_IMAGE }}:${{ github.event.release.tag_name }}"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/gcp-image-promote
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          source_image: ${{ steps.vars.outputs.source }}
          dest_image: ${{ steps.vars.outputs.dest }}

  deploy-backend-prod:
    needs: promote-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: backend-prod
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.PROD_PROJECT }}
          image: ${{ needs.promote-image.outputs.image }}
