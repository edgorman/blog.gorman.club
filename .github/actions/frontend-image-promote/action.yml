name: 'Frontend Image Promote'
description: 'Copies the frontend image from staging Artifact Registry into production by digest, retagged with the release version'

inputs:
  staging_project_id:
    description: 'GCP project holding the source (staging) Artifact Registry repository'
    required: true
  prod_project_id:
    description: 'GCP project the production Artifact Registry repository lives in'
    required: true
  gcp_region:
    description: 'GCP region of both Artifact Registry repositories'
    required: true
  source_tag:
    description: 'Tag of the staging image to promote - the commit SHA the release was cut from'
    required: true
  target_tag:
    description: 'Tag to give the promoted image in production - the formal release version (e.g. v1.0.0)'
    required: true
  workload_identity_provider:
    description: 'The Workload Identity Provider resource name'
    required: true
  service_account:
    description: 'The Google Service Account email'
    required: true

outputs:
  image_ref:
    description: 'Full reference of the production image for this release'
    value: ${{ steps.image.outputs.ref }}

runs:
  using: "composite"
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.24'

    # gcrane authenticates via the ADC file google-github-actions/auth wrote above.
    - name: Install gcrane
      shell: bash
      run: go install github.com/google/go-containerregistry/cmd/gcrane@latest

    - id: image
      shell: bash
      run: echo "ref=${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.prod_project_id }}/frontend/frontend:${{ inputs.target_tag }}" >> "$GITHUB_OUTPUT"

    # Copies by digest, so production runs the identical bytes validated in staging - the same
    # image whose static files frontend-image-extract pulls out next, no rebuild involved.
    - name: Promote Image
      shell: bash
      run: |
        "$(go env GOPATH)/bin/gcrane" cp \
          "${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.staging_project_id }}/frontend/frontend:${{ inputs.source_tag }}" \
          "${{ steps.image.outputs.ref }}"
