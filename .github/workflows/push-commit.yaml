name: 'Push Commit'

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: push-commit-root-main
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.diff.outputs.infrastructure-root }}
      services-frontend: ${{ steps.diff.outputs.services-frontend }}
      services-backend: ${{ steps.diff.outputs.services-backend }}
      infrastructure-staging: ${{ steps.diff.outputs.infrastructure-staging }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        uses: ./.github/actions/github-file-diff
        with:
          branch_ref: ${{ github.ref_name }}

  # Deploys the frontend straight to Cloudflare Pages on every merge to
  # main, per the Staging Deployments section of CLAUDE.md. Cloudflare
  # credentials are fetched directly from Secret Manager via WIF (same
  # pattern as infrastructure-root below), never stored as GitHub Actions
  # secrets/variables — this only works once cloudflare_account_id and
  # cloudflare_api_token exist in Secret Manager (see
  # infrastructure/root/gcp_secret.tf).
  services-frontend:
    needs: [diff, infrastructure-root, infrastructure-staging, services-backend]
    if: |
      always() &&
      needs.diff.outputs.services-frontend == 'true' &&
      needs.diff.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped') &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped') &&
      (needs.services-backend.result == 'success' || needs.services-backend.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
            CLOUDFLARE_ACCOUNT_ID=cloudflare_account_id
      # gcp-secret-manager already authenticated this job to GCP via WIF
      # (needed to read the Cloudflare secrets above) and installed the
      # Cloud SDK, so this reuses that rather than authenticating again.
      # Looked up directly instead of reading services-backend's output,
      # since that job's output is unavailable whenever it's skipped (no
      # backend-related changes on this push) - the URL itself is stable
      # regardless of whether backend-deploy ran on this particular push.
      # Falls back to empty (the frontend's "no backend deployed yet"
      # placeholder) if the Cloud Run service doesn't exist yet.
      - id: backend
        name: Get Backend URL
        shell: bash
        run: |
          URL=$(gcloud run services describe backend-stag \
            --region=europe-west1 \
            --project=blog-gorman-club-stag \
            --format='value(status.url)' 2>/dev/null || true)
          echo "backend_url=$URL" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: 'frontend-stag'
          backend_url: ${{ steps.backend.outputs.backend_url }}

  infrastructure-root:
    needs: diff
    if: needs.diff.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
            TF_VAR_cloudflare_account_id=cloudflare_account_id
            TF_VAR_cloudflare_api_token=cloudflare_api_token
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}

  # Provisions the backend's Artifact Registry repository and Cloud Run
  # service for staging. Only WIF auth is needed (no Secret Manager secrets
  # - this module takes no sensitive vars), so it authenticates directly
  # rather than going through the gcp-secret-manager action.
  infrastructure-staging:
    needs: diff
    if: needs.diff.outputs.infrastructure-staging == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure'
          config_directory: 'infrastructure/config/staging'

  # Builds and deploys the backend image to staging Cloud Run, tagged with
  # the commit SHA per the Staging Deployments section of CLAUDE.md. Must
  # follow infrastructure-staging: the Artifact Registry repository and
  # Cloud Run service have to exist before an image can be pushed/deployed.
  services-backend:
    needs: [diff, infrastructure-staging]
    if: |
      always() &&
      needs.diff.outputs.services-backend == 'true' &&
      needs.diff.result == 'success' &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-deploy
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          gcp_region: 'europe-west1'
          service_name: 'backend-stag'
          image_tag: ${{ github.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

  # Runs on every merge to main, independent of the diff job above: the
  # default patch-bump pre-release is unconditional per CLAUDE.md, not
  # gated on which part of the repo changed.
  pre-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Calculate Next Version
        shell: bash
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          {
            echo "version=v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "last_tag=$LAST_TAG"
          } >> "$GITHUB_OUTPUT"

      - id: commits
        name: Summarize Commits Since Last Release
        shell: bash
        run: |
          if git rev-parse "${{ steps.version.outputs.last_tag }}" >/dev/null 2>&1; then
            RANGE="${{ steps.version.outputs.last_tag }}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo 'log<<COMMITS_EOF'
            git log "$RANGE" --pretty='- %s (%h)'
            echo 'COMMITS_EOF'
          } >> "$GITHUB_OUTPUT"

      # The prod terraform plan CLAUDE.md describes as part of this step is
      # still left out here - infrastructure/config/prod now exists, but
      # wiring an actual `terraform plan` against it into these release
      # notes is tracked as separate follow-up work.
      - name: Write Release Notes
        shell: bash
        run: |
          {
            echo "## Commits since ${{ steps.version.outputs.last_tag }}"
            echo "${{ steps.commits.outputs.log }}"
          } > RELEASE_NOTES.md

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: RELEASE_NOTES.md
