$schema: '../cache/schemas/tasks.json'

# Inherited by every project (no `inheritedBy`). A task's own `inputs` never list the moon.yml that
# declares it, so without this an edit to a task's command in a PR - say services/backend:vet's -
# left that task unaffected, and a broken command merged green.
implicitInputs:
  - 'moon.yml'
