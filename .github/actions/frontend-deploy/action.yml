name: 'Frontend Deploy'
description: 'Builds and deploys the frontend service to Cloudflare Pages'

inputs:
  secrets:
    description: 'Newline-separated CLOUDFLARE_API_TOKEN=... / CLOUDFLARE_ACCOUNT_ID=... pairs (see gcp-secret-manager)'
    required: true
  cloudflare_project_name:
    description: 'Cloudflare Pages project name'
    required: true
  backend_url:
    description: 'Base URL of the backend service, baked in at build time as VITE_BACKEND_URL. Leave unset until the backend service is deployed.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Export Secrets
      shell: bash
      run: echo "${{ inputs.secrets }}" >> "$GITHUB_ENV"

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: services/frontend/package-lock.json

    - name: Install Dependencies
      shell: bash
      working-directory: services/frontend
      run: make install

    - name: Build
      shell: bash
      working-directory: services/frontend
      env:
        VITE_BACKEND_URL: ${{ inputs.backend_url }}
      run: make build

    # --branch=main is required, not just a hint: wrangler infers
    # production vs. preview from the GITHUB_REF_NAME env var GitHub
    # Actions sets from the triggering event, not from the actual checked
    # out git state. push-commit.yaml is triggered by a push to main, so
    # that happens to line up - but promote-release.yaml is triggered by a
    # `release` event, where GITHUB_REF_NAME is the release tag (e.g.
    # v0.0.9), even though its checkout step pins the commit via
    # `ref: github.sha`. Without an explicit --branch, wrangler never sees
    # "main" there and silently deploys as a Preview instead of Production
    # (production_branch for both Pages projects, per cloudflare_pages.tf).
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: services/frontend
        command: pages deploy dist --project-name=${{ inputs.cloudflare_project_name }} --branch=main
