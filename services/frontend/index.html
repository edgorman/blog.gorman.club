<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gorman Club</title>
    <!-- Applied before paint so a dark-mode visitor never sees a light flash. External rather than
         inline so the CSP in public/_headers can forbid inline scripts; see that file. -->

         for this to load before initialising. -->
    <script id="google-identity-services" src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
