name: 'Push Commit'

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: push-commit-root-main
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.diff.outputs.infrastructure-root }}
      services-frontend: ${{ steps.diff.outputs.services-frontend }}
      services-backend: ${{ steps.diff.outputs.services-backend }}
      infrastructure-staging: ${{ steps.diff.outputs.infrastructure-staging }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        uses: ./.github/actions/github-file-diff
        with:
          branch_ref: ${{ github.ref_name }}

  # Builds the frontend image once, tagged with the commit SHA and `latest`, pushes it to staging
  # Artifact Registry, then deploys those exact static files to Cloudflare Pages - one build feeds
  # both, so the live staging site is never rebuilt separately from the stored image.
  services-frontend:
    needs: [diff, infrastructure-root, infrastructure-staging, services-backend]
    if: |
      always() &&
      needs.diff.outputs.services-frontend == 'true' &&
      needs.diff.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped') &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped') &&
      (needs.services-backend.result == 'success' || needs.services-backend.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
            CLOUDFLARE_ACCOUNT_ID=cloudflare_account_id
      # Reuses gcp-secret-manager's WIF auth/Cloud SDK setup rather than authenticating again.
      # Looked up directly since services-backend's output is unavailable when that job is
      # skipped; falls back to empty if the service doesn't exist yet.
      - id: backend
        name: Get Backend URL
        shell: bash
        run: |
          URL=$(gcloud run services describe backend-stag \
            --region=europe-west1 \
            --project=blog-gorman-club-stag \
            --format='value(status.url)' 2>/dev/null || true)
          echo "backend_url=$URL" >> "$GITHUB_OUTPUT"
      - id: image
        uses: ./.github/actions/frontend-image-build
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          gcp_region: 'europe-west1'
          image_tag: ${{ github.sha }}
          backend_url: ${{ steps.backend.outputs.backend_url }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-image-extract
        with:
          image_ref: ${{ steps.image.outputs.image_ref }}
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: 'frontend-stag'

  infrastructure-root:
    needs: diff
    if: needs.diff.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
            TF_VAR_cloudflare_account_id=cloudflare_account_id
            TF_VAR_cloudflare_api_token=cloudflare_api_token
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}

  # Provisions the backend's Artifact Registry + Cloud Run for staging. No sensitive vars,
  # so it authenticates directly (no gcp-secret-manager).
  infrastructure-staging:
    needs: diff
    if: needs.diff.outputs.infrastructure-staging == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure'
          config_directory: 'infrastructure/config/staging'

  # Builds and deploys the backend image to staging, tagged with the commit SHA. Must follow
  # infrastructure-staging so the target resources exist.
  services-backend:
    needs: [diff, infrastructure-staging]
    if: |
      always() &&
      needs.diff.outputs.services-backend == 'true' &&
      needs.diff.result == 'success' &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-deploy
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          gcp_region: 'europe-west1'
          service_name: 'backend-stag'
          image_tag: ${{ github.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

  # Runs unconditionally on every merge; the patch-bump pre-release isn't gated on which part
  # of the repo changed. Tags the commit, lets gren (github-release-notes) draft the release
  # from commit messages, then appends a read-only prod terraform plan so a reviewer can see
  # infra impact before promoting.
  pre-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Calculate Next Version
        shell: bash
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          echo "version=v${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"

      # gren attaches release notes to an existing tag - it can't create one - so the tag has
      # to exist on the remote before gren runs.
      - name: Tag Release
        shell: bash
        run: |
          git tag "${{ steps.version.outputs.version }}" "${{ github.sha }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Plan (prod preview)
        shell: bash
        working-directory: infrastructure
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/infrastructure/config/prod/terraform.tfbackend"
          terraform plan \
            -var-file="${{ github.workspace }}/infrastructure/config/prod/terraform.tfvars" \
            -lock=false \
            -no-color \
            -input=false \
            -out=tfplan.binary
          terraform show -no-color tfplan.binary > tfplan.txt

      - name: Generate Release Notes
        shell: bash
        env:
          GREN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes github-release-notes@0.17.3 release \
            --tags="${{ steps.version.outputs.version }}" \
            --data-source=commits \
            --prerelease \
            --override

      - name: Append Terraform Plan to Release Notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // GitHub release body size limit (with buffer for formatting)
            const MAX_PLAN_LENGTH = 60000;

            const plan = fs.readFileSync('infrastructure/tfplan.txt', 'utf8');
            const truncatedPlan = plan.length > MAX_PLAN_LENGTH
              ? plan.substring(0, MAX_PLAN_LENGTH) + '\n\n... (output truncated due to length)'
              : plan;

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: '${{ steps.version.outputs.version }}',
            });

            const planSection = `\n\n### Terraform Plan for \`prod\` Environment\n\n<details>\n<summary>Show Plan</summary>\n\n\`\`\`hcl\n${truncatedPlan}\n\`\`\`\n\n</details>`;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: release.body + planSection,
            });
