name: 'Terraform Push Commit'
description: 'Performs terraform init and apply'

inputs:
  terraform_directory:
    description: 'The directory containing the Terraform files'
    required: true
  config_directory:
    description: 'The directory containing the configuration files (backend and vars)'
    required: true
  secrets:
    description: 'Newline-separated list of secrets or env vars to export (e.g., KEY=VALUE)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Export Secrets
      shell: bash
      run: |
        if [ -n "${{ inputs.secrets }}" ]; then
          echo "${{ inputs.secrets }}" >> "$GITHUB_ENV"
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.15.8"

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      run: |
        terraform init \
          -backend-config="${{ github.workspace }}/${{ inputs.config_directory }}/terraform.tfbackend"

    - name: Terraform Apply
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      run: |
        # GCP's Service Usage / Firebase Management API enablement can take longer to propagate
        # than any fixed wait reliably covers (see infrastructure/env/firestore.tf's time_sleep
        # resources, which handle the common case) - retry a few times on that specific transient
        # error instead of betting on a single static sleep duration. Any other failure exits
        # immediately without wasted retries.
        max_attempts=3
        for attempt in $(seq 1 "$max_attempts"); do
          if terraform apply \
            -var-file="${{ github.workspace }}/${{ inputs.config_directory }}/terraform.tfvars" \
            -auto-approve \
            -input=false | tee /tmp/tf-apply.log; then
            exit 0
          fi
          if [ "$attempt" -eq "$max_attempts" ] || ! grep -qE "SERVICE_DISABLED|has not been used in project" /tmp/tf-apply.log; then
            exit 1
          fi
          echo "::warning::Terraform apply hit a transient GCP API-enablement error (attempt $attempt/$max_attempts) - waiting 90s for propagation before retrying"
          sleep 90
        done
