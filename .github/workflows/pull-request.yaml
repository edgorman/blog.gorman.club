name: 'Pull Request'

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # The targets each required check hands to `moon ci`. `changed` reads the same variables to decide
  # whether to run the check, so the two can't drift apart. `:name` means that task in any project.
  LINT_CHECK_TARGETS: ':format :lint :vet :typecheck :build :validate root:wire-types root:projects-covered root:go-version-sync root:decision-links'
  TEST_TARGETS: ':test services/backend:image worker:image'
  API_DRIFT_TARGETS: 'packages/api:drift'

concurrency:
  group: pull-request-root-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # moon decides what a diff reaches (decision 41): `moon query affected` lists the tasks whose inputs
  # changed, and every job below gates on that list. Only moon, and not the toolchain it would run
  # tasks with, is installed here (the moon-affected action), which keeps this job to a few seconds.
  # The deploy-{root,staging,prod}:plan markers list a plan's own action and workflow
  # file, so a change to push-commit.yaml or an apply-only action plans nothing.
  changed:
    runs-on: ubuntu-latest
    outputs:
      lint-check: ${{ steps.moon.outputs.lint-check }}
      test: ${{ steps.moon.outputs.test }}
      test-emulator: ${{ steps.moon.outputs.test-emulator }}
      api-drift: ${{ steps.moon.outputs.api-drift }}
      infrastructure-root: ${{ steps.moon.outputs.root }}
      infrastructure-staging: ${{ steps.moon.outputs.staging }}
      infrastructure-prod: ${{ steps.moon.outputs.prod }}
    steps:
      # moon needs full history to resolve the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - id: affected
        uses: ./.github/actions/moon-affected
      - id: moon
        name: Compute moon-affected jobs
        shell: bash
        env:
          AFFECTED_FILE: ${{ steps.affected.outputs.file }}
        run: |
          declare -A targets=(
            [lint-check]=$LINT_CHECK_TARGETS
            [test]=$TEST_TARGETS
            [api-drift]=$API_DRIFT_TARGETS
          )
          # .tasks is omitted when nothing is affected, so `(.tasks // {})` handles null.
          tasks=$(jq -c '(.tasks // {}) | keys' "$AFFECTED_FILE")
          affected() { jq -r --argjson tasks "$tasks" --arg t "$1" '
            ($t | split(" ")) as $want
            | any($tasks[]; . as $k | any($want[]; . as $w
                | if $w | startswith(":") then ($k | endswith($w)) else $k == $w end))' <<<null; }
          for check in "${!targets[@]}"; do
            echo "$check=$(affected "${targets[$check]}")" >> "$GITHUB_OUTPUT"
          done
          # The Firestore emulator is only needed when a Go test will run.
          echo "test-emulator=$(affected ':test')" >> "$GITHUB_OUTPUT"
          for env in root staging prod; do
            echo "$env=$(jq -r --arg t "deploy-$env:plan" '(.tasks // {}) | has($t)' "$AFFECTED_FILE")" >> "$GITHUB_OUTPUT"
          done

  # The three required checks, one job each so each keeps its own check name and a skipped job reports
  # as skipped, which branch protection counts as passing (a matrix leg skipped at job level would
  # report an unexpanded name and stay pending). `:taskId` (no project prefix) is moon's "run in
  # every project that has this task" scope (https://moonrepo.dev/docs/concepts/target); a project
  # without a given task is silently skipped. The targets are the workflow-level `env` above.
  # - lint-check: every lint/format/build task. `:format`/`:validate` reach infra-root/infra-env's
  #   inherited `terraform fmt -check` and `terraform validate` (.moon/tasks/terraform.yml);
  #   `:validate` is `runInCI: 'only'`, so this is the one place it runs at all.
  # - test: every test, plus both images.
  # - api-drift: packages/api:drift, both generators re-run and diffed.
  lint-check:
    needs: changed
    if: needs.changed.outputs.lint-check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          cache: false # see `changed`'s identical setup step above for why
      - name: moon ci
        shell: bash
        run: moon ci $LINT_CHECK_TARGETS
        env:
          MOON_BASE: origin/main

  test:
    needs: changed
    if: needs.changed.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          cache: false # see `changed`'s identical setup step above for why
      # internal/repository/firestore's emulator tests skip unless FIRESTORE_EMULATOR_HOST is set.
      # The emulator jar is the one `gcloud emulators firestore` runs, fetched directly (checksum
      # from firebase-tools' downloadableEmulatorInfo.json). It needs Java 21, which the runner
      # ships beside its default.
      - name: Start the Firestore emulator
        if: needs.changed.outputs.test-emulator == 'true'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firestore-emulator.jar" \
            https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar
          echo "9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c  $RUNNER_TEMP/firestore-emulator.jar" | sha256sum -c -
          nohup "$JAVA_HOME_21_X64/bin/java" -jar "$RUNNER_TEMP/firestore-emulator.jar" --host=127.0.0.1 --port=8081 > "$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8081 > /dev/null; do sleep 1; done'
          echo 'FIRESTORE_EMULATOR_HOST=127.0.0.1:8081' >> "$GITHUB_ENV"
      - name: moon ci
        shell: bash
        run: moon ci $TEST_TARGETS
        env:
          MOON_BASE: origin/main

  api-drift:
    needs: changed
    if: needs.changed.outputs.api-drift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          cache: false # see `changed`'s identical setup step above for why
      - name: moon ci
        shell: bash
        run: moon ci $API_DRIFT_TARGETS
        env:
          MOON_BASE: origin/main

  infrastructure-root:
    needs: changed
    if: needs.changed.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      # The plan identity reads no secret (decision 38). The plan is made without refreshing, against
      # placeholder tokens: 40 characters for Cloudflare (the provider validates the token's shape)
      # and an empty one for GitHub (the provider's owner lookup is anonymous).
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          TF_VAR_github_provider_token: ''
          TF_VAR_cloudflare_api_token: plan-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # infrastructure/env/** is shared, so a change to it plans against both environments - see the
  # `changed` job above.
  infrastructure-staging:
    needs: changed
    if: needs.changed.outputs.infrastructure-staging == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/staging'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # One client ID, defined in infrastructure/root, serves every environment.
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_ci_service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

  infrastructure-prod:
    needs: changed
    if: needs.changed.outputs.infrastructure-prod == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # One client ID, defined in infrastructure/root, serves every environment.
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_ci_service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}

