version: 2
updates:
  - package-ecosystem: 'github-actions'
    # '/' alone covers .github/workflows only, not the composite actions' action.yml files.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    labels:
      - ci
    groups:
      ci-deps:
        patterns:
          - '*'

  - package-ecosystem: 'terraform'
    directories:
      - '/infrastructure/env'
      - '/infrastructure/root'
    schedule:
      interval: 'weekly'
    labels:
      - infrastructure
    groups:
      terraform-deps:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/services/frontend'
    schedule:
      interval: 'weekly'
    labels:
      - frontend
    groups:
      npm-deps:
        patterns:
          - '*'

  - package-ecosystem: 'gomod'
    directory: '/services/backend'
    schedule:
      interval: 'weekly'
    labels:
      - backend
    groups:
      gomod-deps:
        patterns:
          - '*'
