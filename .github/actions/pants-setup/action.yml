name: 'Pants Setup'
description: 'Sets up every toolchain Pants can touch and initializes Pants for a repo-wide invocation'

runs:
  using: "composite"
  steps:
    # A `--changed-since` invocation has no target spec of its own, so it can touch any backend -
    # Go, JavaScript/TypeScript, or Terraform - depending on what the diff contains. The TypeScript
    # check in particular enumerates every target in the repo regardless of scope (see
    # typescript-pants's history, now folded in here), which pulls in Go dependency analysis even
    # for a frontend-only change. Terraform needs no separate setup: Pants downloads its own pinned
    # binary per [download-terraform] in pants.toml.
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: services/backend/go.mod

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: services/frontend/package-lock.json

    - uses: pantsbuild/actions/init-pants@0aaef864bd133c4055feb6adad0bfdce0de1c2e4 # v11
      with:
        gha-cache-key: v0-repo
        named-caches-hash: ${{ hashFiles('services/backend/go.sum', 'services/frontend/package-lock.json') }}
        cache-lmdb-store: 'true'
        # Wires pants.ci.toml's remote_cache_read/write to the runner's own GHA cache credentials -
        # see the comment on those options in pants.ci.toml.
        experimental-remote-cache-via-gha: 'true'
