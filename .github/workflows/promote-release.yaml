name: 'Promote Release'

# Fires when a pre-release generated by push-commit.yaml's `pre-release` job
# is promoted into a formal Release (renamed if a minor/major bump was
# warranted) - and equally when an older release is re-promoted for a
# rollback, per the Rollback Strategy section of CLAUDE.md.
on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: promote-release-main
  cancel-in-progress: false

jobs:
  # Deploys the frontend to production Cloudflare Pages. Rebuilt from
  # source at the released tag's commit rather than reusing the staging
  # build artifact - Vite builds are fast and deterministic, so this is a
  # deliberate deviation from the backend's "never rebuild for production"
  # gcrane image-promotion approach described in CLAUDE.md, not an
  # oversight.
  #
  # Uses github.sha (the commit the release tag points at), not the branch
  # tip, matching the SHA-resolution approach CLAUDE.md prescribes for
  # backend image promotion - a release tag can point at an older commit
  # than main's current HEAD, and a rollback re-promotes an even older one.
  services-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
            CLOUDFLARE_ACCOUNT_ID=cloudflare_account_id
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: 'frontend-prod'

  # The terraform apply on blog-gorman-club-prod and the gcrane-based
  # backend image promotion CLAUDE.md describes as the other two steps of
  # this workflow are deliberately left out until infrastructure/config/prod
  # (the prod Cloud Run + Artifact Registry resources) actually exists -
  # same "wire it up once that part of the repo exists" rule used elsewhere
  # (see github-file-diff and push-commit.yaml's pre-release job).
  # services/backend itself now exists, but nothing builds/pushes its image
  # yet for the same reason.
