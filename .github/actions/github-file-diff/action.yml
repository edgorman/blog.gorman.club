name: 'GitHub File Diff'
description: 'Determines which parts of the infrastructure and services have changed'

inputs:
  branch_ref:
    description: 'The branch we are generating a diff against'
    required: true

outputs:
  infrastructure-root:
    description: 'Whether infrastructure root files changed'
    value: ${{ steps.filter.outputs.infrastructure-root }}
  services-frontend:
    description: 'Whether frontend service files changed'
    value: ${{ steps.filter.outputs.services-frontend }}
  services-backend:
    description: 'Whether backend service files changed'
    value: ${{ steps.filter.outputs.services-backend }}

runs:
  using: "composite"
  steps:
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        base: ${{ inputs.branch_ref }}
        filters: |
          infrastructure-root:
            - 'infrastructure/config/root/**'
            - 'infrastructure/root/**'
            - '.github/actions/terraform-pull-request/**'
            - '.github/actions/terraform-push-commit/**'
            - '.github/actions/gcp-secret-manager/**'

          services-frontend:
            - 'services/frontend/**'
            - '.github/actions/frontend-test/**'
            - '.github/actions/frontend-deploy/**'

          services-backend:
            - 'services/backend/**'
            - '.github/actions/backend-test/**'

          # Add a staging/prod (infrastructure/env) filter here once that
          # area of the repo exists, following the same pattern.
