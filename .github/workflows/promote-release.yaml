name: 'Promote Release'

# Fires when a pre-release is promoted to a formal Release, or an older release is re-promoted for rollback.
on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: promote-release-main
  cancel-in-progress: false

jobs:
  # Step 1: infra applies before any service is touched. Runs unconditionally (human-triggered,
  # and applies are idempotent), unlike push-commit.yaml's diff-gated applies.
  infrastructure-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'

  # Step 2: promote whatever image is currently live on backend-stag by digest via gcrane, not
  # one tagged with github.sha - a release commit may not have touched backend files at all.
  services-backend:
    needs: infrastructure-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_url: ${{ steps.promote.outputs.backend_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: promote
        uses: ./.github/actions/backend-promote
        with:
          staging_project_id: 'blog-gorman-club-stag'
          prod_project_id: 'blog-gorman-club-prod'
          gcp_region: 'europe-west1'
          staging_service_name: 'backend-stag'
          prod_service_name: 'backend-prod'
          target_tag: ${{ github.event.release.tag_name }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

  # Step 3: ensures a frontend image exists for this release - built fresh only if this is a new
  # release; a rollback re-promotion reuses the one already pushed here, skipping the build
  # entirely - then deploys its exact static files to Cloudflare Pages. Depends on services-backend
  # so a new build bakes in the just-promoted backend URL.
  services-frontend:
    needs: [infrastructure-prod, services-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
            CLOUDFLARE_ACCOUNT_ID=cloudflare_account_id
      # Base64-encoded so the JSON (with its embedded quotes) can pass through a build-arg safely;
      # the frontend decodes it with atob(). Not a secret - Firebase web config is meant to ship in
      # the client bundle, access control lives in firestore.rules instead.
      - id: firebase
        name: Get Firebase Web Config
        shell: bash
        run: |
          TOKEN=$(gcloud auth print-access-token)
          APP_NAME=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Goog-User-Project: blog-gorman-club-prod" \
            "https://firebase.googleapis.com/v1beta1/projects/blog-gorman-club-prod/webApps" \
            2>/dev/null | jq -r '.apps[0].name // empty') || true
          CONFIG_B64=""
          if [ -n "$APP_NAME" ]; then
            CONFIG_B64=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-Goog-User-Project: blog-gorman-club-prod" \
              "https://firebase.googleapis.com/v1beta1/${APP_NAME}/config" \
              2>/dev/null | base64 -w0) || true
          fi
          echo "config=$CONFIG_B64" >> "$GITHUB_OUTPUT"
      - id: image
        uses: ./.github/actions/frontend-image-promote
        with:
          gcp_project_id: 'blog-gorman-club-prod'
          gcp_region: 'europe-west1'
          target_tag: ${{ github.event.release.tag_name }}
          backend_url: ${{ needs.services-backend.outputs.backend_url }}
          firebase_config: ${{ steps.firebase.outputs.config }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-image-extract
        with:
          image_ref: ${{ steps.image.outputs.image_ref }}
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: 'frontend-prod'
