name: 'Push Commit'

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: push-commit-root-main
  cancel-in-progress: false

jobs:
  # moon decides which Terraform deployments an apply reaches, as pull-request.yaml's `changed` job
  # decides which to plan. The publish markers decide which of the backend, worker and frontend are
  # rebuilt; the rest reuse base_sha's artifacts (decision 33).
  changed:
    # Skipped until root's apply writes the repository variables (decision 38). Every deploying job
    # needs it.
    if: vars.DEPLOY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      infrastructure-root: ${{ steps.moon.outputs.root }}
      infrastructure-staging: ${{ steps.moon.outputs.staging }}
      backend: ${{ steps.moon.outputs.backend }}
      worker: ${{ steps.moon.outputs.worker }}
      frontend: ${{ steps.moon.outputs.frontend }}
      base_sha: ${{ steps.moon.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      # Only moon, not the toolchain it would run tasks with (see pull-request.yaml's `changed` job).
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: false
          # The toolchain cache is disabled (see pull-request.yaml's `changed` step).
          cache: false
      - id: moon
        name: Compute moon-affected deployments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Diffed against the last commit this workflow fully processed (#262, decision 41): the
          # previous commit when its own run succeeded, else the newest release tag before this
          # commit. So a merge builds and applies only what it changes, not everything since the last
          # release. A cancelled or failed run is never the base, so its work is redone. HEAD~1 is
          # the diff end, so a re-run of a tagged commit sees its own changes. moon reads MOON_BASE
          # as `moon ci` does. With no base, every deployment is marked affected.
          base=
          prev=$(git rev-parse HEAD~1)
          if [ "$(gh run list --workflow push-commit.yaml --branch main --commit "$prev" --status success --json databaseId --jq length)" -gt 0 ]; then
            base=$prev
          else
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD~1 2>/dev/null || true)
          fi
          if [ -n "$base" ]; then
            echo "Diffing against $base"
            export MOON_BASE="$base"
            echo "base_sha=$(git rev-list -n 1 "$base")" >> "$GITHUB_OUTPUT"
          else
            printf '%s=true\n' root staging backend worker frontend >> "$GITHUB_OUTPUT"
            exit 0
          fi
          moon query affected > "$RUNNER_TEMP/affected.json"
          for pair in root=deploy-root:apply staging=deploy-staging:apply backend=services/backend:publish \
            worker=worker:publish frontend=services/frontend:publish; do
            # .tasks is omitted when nothing is affected, so `(.tasks // {})` handles null.
            val=$(jq -r --arg t "${pair#*=}" '(.tasks // {}) | has($t)' "$RUNNER_TEMP/affected.json")
            echo "${pair%%=*}=$val" >> "$GITHUB_OUTPUT"
          done

  # Runs on every merge, so every commit on `main` has a folder in both buckets. It builds when the
  # frontend is affected; otherwise it publishes base_sha's folder again under this commit (or
  # builds, if that folder has aged out). It deploys either way, so staging shows this commit. One
  # folder feeds both buckets and the Worker.
  services-frontend:
    # Runs beside services-backend, not after it: the staging backend's URL is fixed, so the two
    # deploys don't depend on each other. smoke and release-please wait for both. Each infrastructure
    # job skips when its deployment isn't affected, so a skip counts as passing.
    needs: [changed, infrastructure-root, infrastructure-staging]
    if: |
      always() &&
      needs.changed.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped') &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
      # Looked up directly, reusing gcp-secret-manager's auth.
      - id: backend
        name: Get Backend URL
        shell: bash
        run: |
          URL=$(gcloud run services describe backend-stag \
            --region=europe-west1 \
            --project=blog-gorman-club-stag \
            --format='value(status.url)')
          test -n "$URL" || { echo '::error::backend-stag URL not found'; exit 1; }
          echo "backend_url=$URL" >> "$GITHUB_OUTPUT"
      - id: short
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: reuse
        name: Reuse the unchanged frontend
        if: needs.changed.outputs.frontend != 'true'
        continue-on-error: true
        uses: ./.github/actions/frontend-fetch
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          sha: ${{ needs.changed.outputs.base_sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - if: steps.reuse.outcome != 'success'
        uses: ./.github/actions/frontend-build
        with:
          google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: ./.github/actions/frontend-publish
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          prod_project_id: 'blog-gorman-club-prod'
          sha: ${{ github.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: 'frontend-stag'
          cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          backend_url: ${{ steps.backend.outputs.backend_url }}
          # Staging runs a commit, so it shows the short SHA; production shows its release tag (decision 39).
          version: ${{ steps.short.outputs.sha }}
          environment: 'staging'

  infrastructure-root:
    needs: changed
    if: needs.changed.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
            TF_VAR_cloudflare_api_token=cloudflare_api_token
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}

  # Waits on infrastructure-root so any IAM grants or API enablement it applies land first.
  infrastructure-staging:
    needs: [changed, infrastructure-root]
    if: |
      always() &&
      needs.changed.outputs.infrastructure-staging == 'true' &&
      needs.changed.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/staging'
          # One client ID, defined in infrastructure/root, serves every environment.
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
            TF_VAR_ci_service_account=${{ vars.DEPLOY_SERVICE_ACCOUNT }}

  # Runs on every merge, so every commit on `main` has a commit-SHA image in both registries. An
  # unaffected image is base_sha's re-tagged, with no build and no staging deploy. One leg per image
  # (the API and the worker), built from the same Dockerfile with CMD=<image>. Follows
  # infrastructure-staging.
  services-backend:
    name: services-${{ matrix.image }}
    needs: [changed, infrastructure-staging]
    if: |
      always() &&
      needs.changed.result == 'success' &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped')
    strategy:
      # The legs run independently.
      fail-fast: false
      matrix:
        image: [backend, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/backend-deploy
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          prod_project_id: 'blog-gorman-club-prod'
          gcp_region: 'europe-west1'
          service_name: '${{ matrix.image }}-stag'
          image_name: ${{ matrix.image }}
          image_tag: ${{ github.sha }}
          reuse_from: ${{ needs.changed.outputs[matrix.image] != 'true' && needs.changed.outputs.base_sha || '' }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

  # Skipped when this merge changes nothing deployable: the staging site is then the one the last
  # smoke test passed. #277: the deployed frontend and backend together, signed out and read-only, against the live
  # staging site. Covers config.json, CORS, the Worker and routing. Runs once both are live;
  # release-please waits on it.
  smoke:
    needs: [changed, services-backend, services-frontend]
    if: |
      always() &&
      needs.services-backend.result == 'success' &&
      needs.services-frontend.result == 'success' &&
      (needs.changed.outputs.infrastructure-root == 'true' ||
        needs.changed.outputs.infrastructure-staging == 'true' ||
        needs.changed.outputs.backend == 'true' ||
        needs.changed.outputs.worker == 'true' ||
        needs.changed.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # Opens or updates the release PR and, on the release PR's own merge, tags the release (decision
  # 39). It waits on this commit's deploy and smoke test. `if:` tests each direct need for
  # `success` (smoke may also be skipped, when nothing deployable changed), since always() opts out
  # of inherited skips. A skip of any publish job is not release-worthy (#156, #185).
  release-please:
    needs: [services-backend, services-frontend, smoke]
    if: |
      always() &&
      (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') &&
      needs.services-backend.result == 'success' &&
      needs.services-frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_number: ${{ steps.release.outputs.prs_created == 'true' && fromJSON(steps.release.outputs.pr).number || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The PAT, so the release PR triggers the PR checks (decision 39).
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          secrets_list: |
            RELEASE_PLEASE_TOKEN=github_provider_token
      - name: Export Secrets
        shell: bash
        env:
          SECRETS: ${{ steps.secrets.outputs.secrets }}
        run: printf '%s\n' "$SECRETS" >> "$GITHUB_ENV"
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # The prod plan for the open release PR, so a reviewer sees what merging will apply (decision 37).
  plan-prod:
    needs: release-please
    if: needs.release-please.outputs.pr_number != '' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          # Passed as in every prod plan and apply.
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
            TF_VAR_ci_service_account=${{ vars.PROMOTE_SERVICE_ACCOUNT }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pull_request_number: ${{ needs.release-please.outputs.pr_number }}

  # Deploys the release to production from the artifacts already in prod's stores (decision 39);
  # rollback is promote-release.yaml run by hand.
  promote:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/promote-release.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ github.sha }}
