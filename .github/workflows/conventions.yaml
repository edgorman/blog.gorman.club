name: 'Conventions'

# Separate from pull-request.yaml so a title edit reruns only these two cheap checks, not the
# whole build. `edited` covers the title (and body, for the BREAKING CHANGE: footer).
on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The squash commit subject is the PR title, and versioning parses it (root AGENTS.md, Commit
  # Message Convention). In a merge queue the title was already checked on the PR, so this
  # reports skipped, which counts as passing.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit title
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|build|chore|ci|docs|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title '$TITLE' is not a Conventional Commit: type(scope)?!?: description, with type one of feat, fix, build, chore, ci, docs, perf, refactor, revert, style, test."
            exit 1
          fi

  # oasdiff against main's spec, unless the PR declares itself breaking, so a deliberate wire break
  # also bumps major. In a merge queue the squash commit carries the PR title and body, so the
  # same markers are read from it.
  api-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Full history, so origin/main is there to read main's spec from.
        with:
          fetch-depth: 0
      # moon alone first (`auto-install: false`); the toolchain is only installed if the check will
      # run, so a PR that leaves the spec alone, or marks itself breaking, pays for neither.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: false
          cache: false # see pull-request.yaml's `changed` job for why
      - id: run
        name: Decide whether the check runs
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body || github.event.merge_group.head_commit.message }}
          MOON_BASE: origin/main
          # A query runs no task, so moon needs none of the pinned tools (see pull-request.yaml).
          MOON_TOOLCHAIN_FORCE_GLOBALS: 'true'
          MOON_SKIP_SETUP_TOOLCHAIN: 'true'
          GOTOOLCHAIN: local
        run: |
          subject="${TITLE:-${BODY%%$'\n'*}}"
          re='^[a-z]+(\([^)]+\))?!:'
          if [[ "$subject" =~ $re ]] || grep -qE '^BREAKING[ -]CHANGE:' <<<"$BODY"; then
            echo "Marked breaking; skipping the API breaking-change check."
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            moon query affected > "$RUNNER_TEMP/affected.json"
            echo "run=$(jq -r '(.tasks // {}) | has("packages/api:breaking")' "$RUNNER_TEMP/affected.json")" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the toolchain
        if: steps.run.outputs.run == 'true'
        shell: bash
        run: proto install
      - name: moon ci
        if: steps.run.outputs.run == 'true'
        shell: bash
        run: moon ci packages/api:breaking
        env:
          MOON_BASE: origin/main
