name: 'GitHub File Diff'
description: 'Determines which parts of the infrastructure and services have changed'

inputs:
  branch_ref:
    description: 'The branch we are generating a diff against'
    required: true

outputs:
  infrastructure-root:
    description: 'Whether infrastructure root files changed'
    value: ${{ steps.filter.outputs.infrastructure-root }}
  services-frontend:
    description: 'Whether frontend service files changed'
    value: ${{ steps.filter.outputs.services-frontend }}
  services-backend:
    description: 'Whether backend service files changed'
    value: ${{ steps.filter.outputs.services-backend }}
  infrastructure-staging:
    description: 'Whether staging environment infrastructure files changed'
    value: ${{ steps.filter.outputs.infrastructure-staging }}
  infrastructure-prod:
    description: 'Whether prod environment infrastructure files changed'
    value: ${{ steps.filter.outputs.infrastructure-prod }}

runs:
  using: "composite"
  steps:
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        base: ${{ inputs.branch_ref }}
        filters: |
          infrastructure-root:
            - 'infrastructure/config/root/**'
            - 'infrastructure/root/**'
            - '.github/actions/terraform-pull-request/**'
            - '.github/actions/terraform-push-commit/**'
            - '.github/actions/gcp-secret-manager/**'

          services-frontend:
            - 'services/frontend/**'
            - '.github/actions/frontend-test/**'
            - '.github/actions/frontend-deploy/**'
            - '.github/actions/frontend-image-build/**'
            - '.github/actions/frontend-image-extract/**'

          services-backend:
            - 'services/backend/**'
            - '.github/actions/backend-test/**'

          # infrastructure/*.tf is shared between environments, so it appears in both filters below.
          infrastructure-staging:
            - 'infrastructure/*.tf'
            - 'infrastructure/config/staging/**'
            - '.github/actions/backend-deploy/**'
            - '.github/actions/backend-cloudrun-deploy/**'

          infrastructure-prod:
            - 'infrastructure/*.tf'
            - 'infrastructure/config/prod/**'
            - '.github/actions/backend-promote/**'
            - '.github/actions/backend-cloudrun-deploy/**'
            - '.github/actions/frontend-image-promote/**'
            - '.github/actions/frontend-image-extract/**'
            - '.github/actions/frontend-deploy/**'
