name: 'Conventions'

# Separate from pull-request.yaml so a title edit reruns only these two cheap checks, not the
# whole build. `edited` covers the title (and body, for the BREAKING CHANGE: footer).
on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The squash commit subject is the PR title, and versioning parses it (root AGENTS.md, Commit
  # Message Convention).
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit title
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|build|chore|ci|docs|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title '$TITLE' is not a Conventional Commit: type(scope)?!?: description, with type one of feat, fix, build, chore, ci, docs, perf, refactor, revert, style, test."
            exit 1
          fi

  # oasdiff against main's spec, unless the PR declares itself breaking, so a deliberate wire break
  # also bumps major.
  api-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Full history, so origin/main is there to read main's spec from.
        with:
          fetch-depth: 0
      # moon alone first; the toolchain is only installed if the check will run, so a PR that
      # leaves the spec alone, or marks itself breaking, pays for neither.
      - id: affected
        uses: ./.github/actions/moon-affected
      - id: run
        name: Decide whether the check runs
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AFFECTED_FILE: ${{ steps.affected.outputs.file }}
        run: |
          re='^[a-z]+(\([^)]+\))?!:'
          if [[ "$TITLE" =~ $re ]] || grep -qE '^BREAKING[ -]CHANGE:' <<<"$BODY"; then
            echo "Marked breaking; skipping the API breaking-change check."
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo "run=$(jq -r '(.tasks // {}) | has("packages/api:breaking")' "$AFFECTED_FILE")" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the toolchain
        if: steps.run.outputs.run == 'true'
        shell: bash
        run: proto install
      - name: moon ci
        if: steps.run.outputs.run == 'true'
        shell: bash
        run: moon ci packages/api:breaking
        env:
          MOON_BASE: origin/main
