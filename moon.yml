$schema: './.moon/cache/schemas/project.json'
workspace:
  # The root project must not inherit tasks meant for real projects (e.g. .moon/tasks/terraform.yml's
  # format/validate, tagged 'terraform' - this project carries no such tag today, but an inherited-by-
  # default task here would run repo-wide checks against the whole tree for no reason).
  inheritedTasks:
    include: []

tasks:
  # Keeps hand-written wire types out: api.ts and internal/service declare none, so a shape is always
  # a generated one (packages/api/AGENTS.md).
  wire-types:
    script: |
      if grep -n '^export interface' services/frontend/src/lib/api.ts; then
        echo "::error file=services/frontend/src/lib/api.ts::api.ts declares a hand-written interface - wire types must come from src/gen (see packages/api/AGENTS.md)."
        exit 1
      fi
      if grep -rn 'json:"' services/backend/internal/service --include='*.go' | grep -v '_test.go'; then
        echo "::error::internal/service declares a hand-written json-tagged struct - wire types must come from packages/api (see packages/api/AGENTS.md)."
        exit 1
      fi
    inputs:
      - '/services/frontend/src/lib/api.ts'
      - '/services/backend/internal/service/**/*.go'

  # A services/* or packages/* folder without its own moon.yml is exactly the folder
  # services/*/moon.yml and packages/*/moon.yml globs (#191) would silently skip discovering as a
  # project, so check for the file directly rather than parsing `moon query projects` output - the
  # two are equivalent (a glob only picks up a folder that has one) and this needs no JSON parsing
  # or dependency on the query command's shape.
  projects-covered:
    description: 'Every services/* and packages/* folder is a moon project'
    script: |
      missing=0
      for dir in services/*/ packages/*/; do
        dir="${dir%/}"
        if [ ! -f "$dir/moon.yml" ]; then
          echo "::error file=$dir::${dir} has no moon.yml - every services/* and packages/* folder must be a moon project (see #196)."
          missing=1
        fi
      done
      exit "$missing"
    # Recursive, not '/services/*': a single '*' never crosses a '/', so it matched no file inside
    # a new folder and the check never became affected by the very change it exists to catch.
    inputs:
      - '/services/**/*'
      - '/packages/**/*'
      - '/.moon/workspace.yml'

  # .prototools' `go` pin (#191) is a second source of truth alongside go.mod's own `go` line -
  # keeping them in sync is a manual invariant now that setup-go no longer reads go.mod alone.
  go-version-sync:
    description: '.prototools go pin matches services/backend/go.mod'
    script: |
      prototools_go="$(grep -E '^go = ' .prototools | sed -E 's/^go = "([^"]+)".*/\1/')"
      gomod_go="$(grep -E '^go ' services/backend/go.mod | awk '{print $2}')"
      if [ "$prototools_go" != "$gomod_go" ]; then
        echo "::error file=.prototools::.prototools pins go ${prototools_go} but services/backend/go.mod requires go ${gomod_go} - keep them in sync."
        exit 1
      fi
    inputs:
      - '/.prototools'
      - '/services/backend/go.mod'

  # Every docs/decisions/NNNN-*.md a Markdown file links must exist.
  decision-links:
    description: 'Every decision record linked from a Markdown file exists'
    script: |
      missing=0
      while IFS=: read -r file link; do
        if [ ! -f "docs/decisions/${link#decisions/}" ]; then
          echo "::error file=$file::links ${link}, which does not exist in docs/decisions/."
          missing=1
        fi
      done < <(grep -rEo --include='*.md' --exclude-dir=node_modules --exclude-dir=.git 'decisions/[0-9]{4}-[a-z0-9-]+\.md' . | sed 's|^\./||')
      exit "$missing"
    inputs:
      - '/**/*.md'
      - '!/CHANGELOG.md'

  # Marker for security.yaml's workflows job: actionlint and zizmor read these.
  scan-workflows:
    command: 'noop'
    inputs:
      - '/.github/workflows/**/*'
      - '/.github/actions/**/*'
      - '/.github/scripts/**/*'
    options:
      # Not runInCI: false: a noop task is harmless to execute, and excluding it from CI would hide it
      # from moon query affected's CI-mode results, which the workflows' `changed` jobs read.
      cache: false

  # Marker for security.yaml's secrets job: any file can leak a secret, but release-please's generated files carry none.
  scan-secrets:
    command: 'noop'
    inputs:
      - '/**/*'
      - '!/CHANGELOG.md'
      - '!/.github/.release-please-manifest.json'
      - '!/.github/version.txt'
    options:
      # Not runInCI: false: a noop task is harmless to execute, and excluding it from CI would hide it
      # from moon query affected's CI-mode results, which the workflows' `changed` jobs read.
      cache: false
