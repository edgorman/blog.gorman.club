name: 'Promote Release'

# Fires when a pre-release generated by push-commit.yaml's `pre-release` job
# is promoted into a formal Release (renamed if a minor/major bump was
# warranted) - and equally when an older release is re-promoted for a
# rollback, per the Rollback Strategy section of CLAUDE.md.
on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: promote-release-main
  cancel-in-progress: false

jobs:
  # Step 1 of Production Releases in CLAUDE.md: infra changes apply before
  # any service is touched. Runs unconditionally on every promotion (unlike
  # push-commit.yaml's diff-gated applies) since it's a deliberate,
  # human-triggered action rather than a per-commit continuous apply, and
  # Terraform applies are idempotent regardless.
  infrastructure-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure'
          config_directory: 'infrastructure/config/prod'

  # Step 2 of Production Releases in CLAUDE.md: promote the staging image by
  # digest via gcrane rather than rebuilding - github.sha here is the commit
  # the release tag points at (its target_commitish), which is what staging
  # tagged its image with, per the Staging Deployments section.
  services-backend:
    needs: infrastructure-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_url: ${{ steps.promote.outputs.backend_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: promote
        uses: ./.github/actions/backend-promote
        with:
          staging_project_id: 'blog-gorman-club-stag'
          prod_project_id: 'blog-gorman-club-prod'
          gcp_region: 'europe-west1'
          service_name: 'backend-prod'
          source_tag: ${{ github.sha }}
          target_tag: ${{ github.event.release.tag_name }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

  # Step 3: bump the frontend and Cloud Run traffic together. Frontend is
  # rebuilt from source at the released tag's commit rather than reusing the
  # staging build artifact - Vite builds are fast and deterministic, so this
  # is a deliberate deviation from the backend's "never rebuild for
  # production" gcrane approach above, not an oversight.
  #
  # Depends on services-backend (not just infrastructure-prod) so the
  # frontend always bakes in the backend URL for the image just promoted,
  # matching the "infra before services" ordering CLAUDE.md prescribes.
  services-frontend:
    needs: [infrastructure-prod, services-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
            CLOUDFLARE_ACCOUNT_ID=cloudflare_account_id
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: 'frontend-prod'
          backend_url: ${{ needs.services-backend.outputs.backend_url }}
