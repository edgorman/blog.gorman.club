name: 'Apply Prod Infrastructure (Manual)'

# Applies `infrastructure/env` to prod outside a promotion. Prod infrastructure normally changes
# through Promote Release (`promote-release.yaml`), step 1, with the plan posted on the release PR.
# Run this to add a newly created per-environment resource (a bucket, a registry, an IAM binding)
# to prod when a merge-time job already depends on it.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm: this runs terraform apply on blog-gorman-club-prod right now, outside of a release promotion.'
        required: true

permissions:
  contents: read

concurrency:
  # Shared with Promote Release; runs queue on prod's Terraform state.
  group: promote-release-main
  cancel-in-progress: false

jobs:
  infrastructure-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "apply" ]; then
            echo "::error::Input 'confirm' must be exactly \"apply\" - refusing to run terraform apply on blog-gorman-club-prod. If you're not deliberately backfilling a new resource ahead of a promotion, use Promote Release instead."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
        env:
          # One client ID, defined in infrastructure/root, serves every environment.
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_ci_service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}
