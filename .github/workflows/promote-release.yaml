name: 'Promote Release'

# Fires when a pre-release is promoted to a Release, or an older one is re-promoted to roll back.
on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: promote-release-main
  cancel-in-progress: false

jobs:
  # Step 1: infra applies before any service is touched, unconditionally - applies are idempotent.
  infrastructure-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          # Absent until infrastructure/root has applied, and unread until a budget_amount is
          # set, so it is optional: a plan on a pull request that adds it must not need it.
          optional_secrets_list: |
            TF_VAR_billing_account=gcp_billing_account
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          # One client ID, defined in infrastructure/root, serves every environment. The
          # billing account the budget in monitoring.tf hangs off comes from Secret Manager rather
          # than a tfvars file, so this public repository never records the account paying for it.
          secrets: |
            ${{ steps.secrets.outputs.secrets }}
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}

  # Step 2: promote whatever image is live on backend-stag by digest, since a release commit may
  # not have touched the backend at all.
  services-backend:
    needs: infrastructure-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_url: ${{ steps.promote.outputs.backend_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - id: promote
        uses: ./.github/actions/backend-promote
        with:
          staging_project_id: 'blog-gorman-club-stag'
          prod_project_id: 'blog-gorman-club-prod'
          gcp_region: 'europe-west1'
          staging_service_name: 'backend-stag'
          prod_service_name: 'backend-prod'
          target_tag: ${{ github.event.release.tag_name }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

  # Step 3: build this release's frontend image only if it doesn't exist yet (a rollback reuses
  # the one already pushed), then deploy its static files. Needs the just-promoted backend URL.
  services-frontend:
    needs: [infrastructure-prod, services-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
            CLOUDFLARE_ACCOUNT_ID=cloudflare_account_id
      - id: image
        uses: ./.github/actions/frontend-image-promote
        with:
          gcp_project_id: 'blog-gorman-club-prod'
          gcp_region: 'europe-west1'
          target_tag: ${{ github.event.release.tag_name }}
          backend_url: ${{ needs.services-backend.outputs.backend_url }}
          google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-image-extract
        with:
          image_ref: ${{ steps.image.outputs.image_ref }}
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: 'frontend-prod'
