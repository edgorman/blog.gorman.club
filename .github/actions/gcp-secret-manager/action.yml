name: 'GCP Secret Manager'
description: 'Reads secrets from GCP Secret Manager and outputs them in a format suitable for the Terraform actions'

inputs:
  project_id:
    description: 'The GCP Project ID'
    required: true
  workload_identity_provider:
    description: 'The Workload Identity Provider resource name'
    required: true
  service_account:
    description: 'The Google Service Account email'
    required: true
  secrets_list:
    description: 'A newline-separated list of mapping between ENV_VAR and Secret name (e.g. DB_PASSWORD=database-pwd)'
    required: true

outputs:
  secrets:
    description: 'Newline-separated list of secrets in KEY=VALUE format'
    value: ${{ steps.fetch-secrets.outputs.formatted_secrets }}

runs:
  using: 'composite'
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - id: fetch-secrets
      name: Fetch Secrets
      shell: bash
      run: |
        RESULT=()
        # Each line is ENV_VAR=SECRET_NAME.
        while IFS='=' read -r KEY SECRET_NAME; do
          [ -n "$KEY" ] || continue

          echo "Fetching secret: $SECRET_NAME for $KEY"
          VALUE=$(gcloud secrets versions access latest --secret="$SECRET_NAME" --project="${{ inputs.project_id }}")

          # GitHub only auto-masks the `secrets:` context, so mask before the value is echoed anywhere.
          echo "::add-mask::$VALUE"
          RESULT+=("$KEY=$VALUE")
        done <<< "${{ inputs.secrets_list }}"

        {
          echo "formatted_secrets<<SECRETS_EOF"
          if [ ${#RESULT[@]} -gt 0 ]; then printf '%s\n' "${RESULT[@]}"; fi
          echo "SECRETS_EOF"
        } >> "$GITHUB_OUTPUT"
