$schema: '../../../.moon/cache/schemas/project.json'
# The dependency on deploy-root is apply ordering, not a build edge - modelled here only so
# `moon project-graph` reads correctly (prod's own apply ordering lives in promote-release.yaml
# and apply-infrastructure-prod.yaml, not push-commit.yaml - prod never applies on a bare merge).
dependsOn: ['infra-env', 'deploy-root']
tags: ['deployment']

tasks:
  # A marker task: 'inputs' is the real point of it, defining exactly what reaches this
  # environment's plan/apply. Its own plan/apply run in the workflow job with WIF creds, not here.
  plan:
    command: 'noop'
    inputs:
      - 'terraform.tfbackend'
      - 'terraform.tfvars'
      - 'project://infra-env'
      - '/.github/actions/terraform-pull-request/**/*'
      - '/.github/actions/terraform-push-commit/**/*'
      - '/.github/workflows/pull-request.yaml'
      - '/.github/workflows/push-commit.yaml'
      - '/.github/workflows/promote-release.yaml'
      - '/.github/workflows/apply-infrastructure-prod.yaml'
    options:
      # Not runInCI: false - see infrastructure/config/root/moon.yml's comment: a noop task is
      # harmless for moon-ci to execute, and excluding it from CI also hides it from
      # moon query affected's CI-mode results, which #198's moon-changed job needs.
      cache: false
