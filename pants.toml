[GLOBAL]
pants_version = "2.33.0"
# go vet needs go.mod at the Pants build root, which services/backend/go.mod deliberately isn't
# (#114) - see CLAUDE.md's "Building with Pants" section. Re-enable once the upstream bug is fixed.
backend_packages = [
  "pants.backend.experimental.go",
  "pants.backend.experimental.terraform",
  "pants.backend.docker",
  "pants.backend.experimental.javascript",
  "pants.backend.experimental.typescript",
  # Enabled only for the protobuf_sources/protobuf_source BUILD target types and buf lint/format;
  # pants.backend.python comes with it since protobuf.python's python_resolve field needs a rule
  # only that backend provides. See CLAUDE.md's "Contract Layer" section for the rest.
  "pants.backend.python",
  "pants.backend.codegen.protobuf.python",
  "pants.backend.codegen.protobuf.lint.buf",
]

# See CLAUDE.md's "Contract Layer" section: this repo never generates or consumes Python bindings,
# so there's no `protobuf` runtime requirement to add.
[python-protobuf]
infer_runtime_dependency = false

[source]
root_patterns = [
  "/services/backend",
  "/services/frontend",
  "/packages/protos",
  # Restores the "/" root_patterns default this list's override otherwise drops - without it,
  # TypeScript's `check` can't walk up from services/frontend/src to find package_json/tsconfig.
  "/services",
]

# Registered so `docker_image` can reference them by `@stag`/`@prod`; both stay `skip_push` and
# neither `default`. See CLAUDE.md's "Artifact Stores" and "Building with Pants" sections.
[docker.registries]
stag = {address = "europe-west1-docker.pkg.dev/blog-gorman-club-stag", default = false, skip_push = true}
prod = {address = "europe-west1-docker.pkg.dev/blog-gorman-club-prod", default = false, skip_push = true}

# No Python code lives here - required only because the Terraform backend's dependency inference
# parses .tf files with a Python-implemented HCL2 parser that Pants runs as a PEX.
[python]
interpreter_constraints = [">=3.9,<3.13"]

# Matches infrastructure/*/providers.tf's exact required_version pin.
[download-terraform]
version = "1.15.8"
known_versions.add = [
  "1.15.8|linux_x86_64|d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d|35332471",
  "1.15.8|linux_arm64|8891e9dcedc9e3b8950bc6af9d4d8af1f4cfade3062f53b9dc403a89f6ce8c9c|31597571",
  "1.15.8|macos_x86_64|e2e812e783771159bf758fd4e55d6dc9bb08f63e2af2c63d212721807a02c5dc|36512579",
  "1.15.8|macos_arm64|f210110c5698b94d803a7a63cdb0251b5455c150841478808e2bbb343f95ed68|32885003",
]
# See CLAUDE.md's "Building with Pants" section: an empty sandbox PATH makes `getent` unfindable,
# which fails terraform's DNS resolution before it ever reaches the network.
extra_env_vars = ["PATH"]
