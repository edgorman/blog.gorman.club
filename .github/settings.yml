# This file is synced to GitHub by https://github.com/repository-settings/app
#
# Repository settings, branch protection, and labels are managed declaratively
# from here. Edit this file (via a pull request) rather than changing settings
# by hand in the GitHub UI — manual changes will be reverted on the next sync.

repository:
  # General
  name: blog.gorman.club
  description: The blog subdomain for the gorman.club website.
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: false

  default_branch: main

  # Merge button behaviour — squash-only keeps trunk history linear, which the
  # release-please tagging strategy in .github/AGENTS.md depends on.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  delete_branch_on_merge: true

  # Security
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

labels:
  - name: infrastructure
    color: "1d76db"
    description: Terraform / infrastructure changes
  - name: backend
    color: "0e8a16"
    description: Backend service changes
  - name: frontend
    color: "fbca04"
    description: Frontend changes
  - name: ci
    color: "5319e7"
    description: GitHub Actions / workflow changes
  - name: release
    color: "0052cc"
    description: Related to a release or its promotion to production

branches:
  - name: main
    protection:
      # Require every change to land via reviewed PR — trunk-based dev with
      # no direct pushes to main.
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true

      # Three checks that report on every PR, normal or release. `required` is the last job of
      # .github/workflows/pull-request.yaml: it waits for the lint, test, API-drift and plan jobs,
      # which a change may skip (a release PR skips most of them), and fails only if one that ran
      # failed. `pr-title` and `api-breaking` are in conventions.yaml and always run. Naming the
      # skippable jobs here would list them as required when they were skipped.
      #
      # `strict: true` makes each PR re-run CI after every merge ahead of it. A merge queue would
      # batch that, but GitHub only offers merge queues to organization-owned repositories, and
      # this one is user-owned, so there is no queue to configure here.
      required_status_checks:
        strict: true
        contexts:
          - required
          - pr-title
          - api-breaking

      # Stays false on purpose (#275): Claude Code opens PRs as @edgorman, GitHub never lets an
      # author approve their own PR, so the owner merges those with the admin override. Revisit
      # once a second code owner can approve them.
      enforce_admins: false
      required_linear_history: true
      required_conversation_resolution: true
      restrictions: null
      allow_force_pushes: false
      allow_deletions: false
