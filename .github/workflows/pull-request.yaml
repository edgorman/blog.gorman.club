name: 'Pull Request'

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pull-request-root-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Replaces the old dorny/paths-filter-only `diff` job. Terraform's own graph
  # (infrastructure/*/BUILD, wired up in #143) now decides which environment(s) a change reaches -
  # infrastructure/env:mod is depended on by both infrastructure/config/{staging,prod}:deployment,
  # so a change to infrastructure/env/** affects both without either being named here. The one thing
  # Pants can't see is a composite action (see github-file-diff), so that stays a small glob layered
  # on top with OR.
  changed:
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.combine.outputs.infrastructure-root }}
      infrastructure-staging: ${{ steps.combine.outputs.infrastructure-staging }}
      infrastructure-prod: ${{ steps.combine.outputs.infrastructure-prod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # --changed-since=origin/main needs origin/main to actually be present locally.
          fetch-depth: 0
      - id: github-diff
        uses: ./.github/actions/github-file-diff
        with:
          branch_ref: ${{ github.base_ref }}
      - id: pants
        uses: ./.github/actions/pants-changed
        with:
          since: origin/main
      - id: combine
        shell: bash
        run: |
          combine() {
            if [ "$1" = 'true' ] || [ "${{ steps.github-diff.outputs.github-actions }}" = 'true' ]; then
              echo true
            else
              echo false
            fi
          }
          echo "infrastructure-root=$(combine '${{ steps.pants.outputs.infrastructure-root }}')" >> "$GITHUB_OUTPUT"
          echo "infrastructure-staging=$(combine '${{ steps.pants.outputs.infrastructure-staging }}')" >> "$GITHUB_OUTPUT"
          echo "infrastructure-prod=$(combine '${{ steps.pants.outputs.infrastructure-prod }}')" >> "$GITHUB_OUTPUT"

  # Replaces services-frontend, services-frontend-pants, services-backend, services-backend-pants,
  # and infrastructure-pants: one lint/check invocation over whatever the diff touches, rather than
  # a job per service gated on a hand-maintained glob. Per Pants' CI guidance, linters don't care
  # about dependents - a change to a leaf file doesn't need its callers re-linted.
  #
  # `go vet` and oxlint run here too, unconditionally rather than gated on --changed-since: neither
  # has a Pants integration (go vet's is disabled for the upstream working-directory bug documented
  # in pants.toml; oxlint has no Pants backend at all), so there is no Pants-derived affected-target
  # set to scope them to, and both are cheap enough not to need one.
  lint-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pants-setup
      - name: Lint, Check
        shell: bash
        run: pants --changed-since=origin/main lint check
      # Repo-wide rather than --changed-since: a target missing from a diff's own files isn't what
      # this catches, a source file with no covering target *anywhere* is - and that can only be
      # seen by looking at the whole tree, same as `pants tailor --check` always does (#155).
      - name: Tailor Check
        shell: bash
        run: pants tailor --check ::
      # go.mod deliberately doesn't sit at the Pants build root (#114), so `go vet` needs to run
      # from services/backend itself to find it - same reason pants.backend.experimental.go.lint.vet
      # stays disabled (see pants.toml).
      - name: Vet backend
        working-directory: services/backend
        shell: bash
        run: go vet ./...
      # oxlint isn't a Pants-managed dependency, so the checkout's own node_modules has to exist
      # before `npm run lint` can find it - same install protos-drift already does for the same
      # reason.
      - name: Install frontend dependencies
        working-directory: services/frontend
        shell: bash
        run: npm ci
      - name: Lint frontend
        working-directory: services/frontend
        shell: bash
        run: npm run lint

  # Unlike lint-check, tests need transitive dependents: a change to a shared package must re-run
  # every test that exercises it, not just tests that touch the changed file directly.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pants-setup
      - name: Test
        shell: bash
        run: pants --changed-since=origin/main --changed-dependents=transitive test

  # #121/#122: `buf generate` is deterministic, so re-running it and diffing is how drift between
  # packages/protos/*.proto and the committed bindings it owns (services/backend/internal/gen and,
  # since #122, services/frontend/src/gen) gets caught - editing one without regenerating the
  # others fails here instead of silently shipping a stale contract. Always runs, unconditionally -
  # unlike lint-check/test above there is no Pants target graph to ask "did this PR touch protos",
  # since Pants never generates this code (see pants.toml), and the check is cheap enough not to
  # need one.
  protos-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/backend/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json
      # The ts-proto plugin buf.gen.yaml invokes lives at
      # services/frontend/node_modules/.bin/protoc-gen-ts_proto - it has to be installed before
      # `buf generate` runs, same as the Go plugin needs services/backend/go.mod's module cache.
      - name: Install frontend dependencies
        working-directory: services/frontend
        shell: bash
        run: npm ci
      - uses: bufbuild/buf-setup-action@9672cee01808979ea1249f81d6d321217b9a10f6 # v1.47.2
        with:
          version: '1.47.2'
      - name: Generate
        working-directory: packages/protos
        shell: bash
        run: buf generate
      - name: Check for drift
        shell: bash
        run: |
          # `git diff` alone ignores untracked files, so a new .proto whose generated output is
          # never committed would pass silently - staging first makes a new file count as drift too.
          git add -A -- packages/protos services/backend/internal/gen services/frontend/src/gen
          if ! git diff --cached --exit-code -- packages/protos services/backend/internal/gen services/frontend/src/gen; then
            echo "::error::packages/protos and its generated bindings (services/backend/internal/gen, services/frontend/src/gen) have drifted - run 'buf generate' from packages/protos and commit the result."
            exit 1
          fi

  infrastructure-root:
    needs: changed
    if: needs.changed.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
            TF_VAR_cloudflare_account_id=cloudflare_account_id
            TF_VAR_cloudflare_api_token=cloudflare_api_token
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # infrastructure/env/** is shared, so a change to it plans against both environments - see the
  # `changed` job above.
  infrastructure-staging:
    needs: changed
    if: needs.changed.outputs.infrastructure-staging == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/staging'
          # One client ID, defined in infrastructure/root, serves every environment.
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  infrastructure-prod:
    needs: changed
    if: needs.changed.outputs.infrastructure-prod == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          # One client ID, defined in infrastructure/root, serves every environment.
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
