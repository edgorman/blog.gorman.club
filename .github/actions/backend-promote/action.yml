name: 'Backend Promote'
description: 'Copies the backend image from staging Artifact Registry into production by digest, retagged with the release version, and deploys it to Cloud Run'

inputs:
  staging_project_id:
    description: 'GCP project holding the source (staging) Artifact Registry repository'
    required: true
  prod_project_id:
    description: 'GCP project the production Artifact Registry repository and Cloud Run service live in'
    required: true
  gcp_region:
    description: 'GCP region of both Artifact Registry repositories and the Cloud Run service'
    required: true
  staging_service_name:
    description: 'Staging Cloud Run service name to read the currently-live image from (e.g. backend-stag)'
    required: true
  prod_service_name:
    description: 'Production Cloud Run service name to deploy to (e.g. backend-prod)'
    required: true
  target_tag:
    description: 'Tag to give the promoted image in production - the formal release version (e.g. v1.0.0)'
    required: true
  workload_identity_provider:
    description: 'The Workload Identity Provider resource name'
    required: true
  service_account:
    description: 'The Google Service Account email'
    required: true

outputs:
  backend_url:
    description: 'Public URL of the deployed Cloud Run service'
    value: ${{ steps.deploy.outputs.backend_url }}

runs:
  using: "composite"
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.24'

    # gcrane authenticates via the ADC file google-github-actions/auth wrote above.
    - name: Install gcrane
      shell: bash
      run: go install github.com/google/go-containerregistry/cmd/gcrane@latest

    # Resolves what is deployed to staging now, since a release cut from a backend-untouched
    # commit has no image under its SHA at all.
    - id: staging_image
      name: Resolve Staging Image
      shell: bash
      run: |
        DESCRIBE_ARGS=(
          "${{ inputs.staging_service_name }}"
          --region="${{ inputs.gcp_region }}"
          --project="${{ inputs.staging_project_id }}"
        )
        # gcloud uses the legacy Knative path; fall back to the v2 shape in case that changes.
        IMAGE=$(gcloud run services describe "${DESCRIBE_ARGS[@]}" \
          --format='value(spec.template.spec.containers[0].image)')
        if [ -z "$IMAGE" ]; then
          IMAGE=$(gcloud run services describe "${DESCRIBE_ARGS[@]}" \
            --format='value(template.containers[0].image)')
        fi
        if [ -z "$IMAGE" ]; then
          echo "::error::Could not resolve the currently deployed image for ${{ inputs.staging_service_name }}"
          exit 1
        fi
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

    - id: image
      shell: bash
      run: echo "ref=${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.prod_project_id }}/backend/backend:${{ inputs.target_tag }}" >> "$GITHUB_OUTPUT"

    # Copies by digest, so production runs the identical bytes validated in staging.
    - name: Promote Image
      shell: bash
      run: |
        "$(go env GOPATH)/bin/gcrane" cp \
          "${{ steps.staging_image.outputs.image }}" \
          "${{ steps.image.outputs.ref }}"

    - id: deploy
      uses: ./.github/actions/backend-cloudrun-deploy
      with:
        gcp_project_id: ${{ inputs.prod_project_id }}
        gcp_region: ${{ inputs.gcp_region }}
        service_name: ${{ inputs.prod_service_name }}
        image: ${{ steps.image.outputs.ref }}
