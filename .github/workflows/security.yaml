name: 'Security'

# Advisory scanning (decision 33): every scanner reports what it finds in the job summary and as a
# warning, and none of them fails a run or is a required check. A scanner that cannot run at all
# does fail (.github/scripts/advisory.sh). Everything here is an open-source CLI run as an ordinary
# job, so it works on any plan; code scanning and secret scanning from GitHub need a paid one.
on:
  pull_request:
    branches:
      - main
  # New advisories land without a commit, so main is scanned weekly too.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which scanners a pull request reaches, from the files it changes. No scanner is a
  # required check (decision 33), so a skipped job costs a merge nothing. The weekly scan and a
  # manual run have no diff, so they run everything. `secrets` runs on every change except a
  # release PR's (only generated files): any other file can leak.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
      frontend: ${{ steps.diff.outputs.frontend }}
      workflows: ${{ steps.diff.outputs.workflows }}
      terraform: ${{ steps.diff.outputs.terraform }}
      image: ${{ steps.diff.outputs.image }}
      release: ${{ steps.release.outputs.only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - id: release
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/release-only
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_ONLY: ${{ steps.release.outputs.only }}
        run: |
          # The release PR changes only generated files, so nothing needs scanning.
          if [ "$RELEASE_ONLY" = true ]; then
            printf '%s=false\n' go frontend workflows terraform image >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A scanner's own workflow file and helper script are inputs to it, so editing either
          # re-runs everything that uses them.
          common='^(\.github/workflows/security\.yaml|\.github/scripts/advisory\.sh)$'
          if [ "$EVENT" != pull_request ]; then
            printf '%s=true\n' go frontend workflows terraform image >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE...$HEAD" > changed.txt
          # `grep -E` exits 1 on no match, which is the "false" answer here.
          check() { if grep -Eq "$common|$2" changed.txt; then echo "$1=true"; else echo "$1=false"; fi; }
          {
            check go '^(services/backend/|packages/api/|\.prototools$)'
            check frontend '^(services/frontend/|packages/api/)'
            check workflows '^\.github/(workflows|actions|scripts)/'
            check terraform '^(infrastructure/|\.prototools$)'
            check image '^services/backend/'
          } | tee -a "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          cache: false # decision 35
      - name: Install scanners
        run: |
          # renovate: datasource=go depName=golang.org/x/vuln
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          # renovate: datasource=go depName=github.com/securego/gosec/v2
          GOBIN="$RUNNER_TEMP/bin" go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: govulncheck
        working-directory: services/backend
        run: ../../.github/scripts/advisory.sh govulncheck 3 govulncheck ./...
      - name: gosec
        working-directory: services/backend
        # -no-fail: gosec exits 0 whatever it finds, so only a failure to run fails the step.
        run: ../../.github/scripts/advisory.sh gosec 1 gosec -no-fail ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: npm audit
        working-directory: services/frontend
        run: ../../.github/scripts/advisory.sh 'npm audit' 1 npm audit --omit=dev

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          cache: false # decision 35
      - name: Install scanners
        run: |
          # renovate: datasource=go depName=github.com/rhysd/actionlint
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # renovate: datasource=pypi depName=zizmor
          pip install --user zizmor==1.32.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: actionlint
        run: .github/scripts/advisory.sh actionlint 1 actionlint
      - name: zizmor
        # --no-exit-codes: zizmor otherwise exits 10-14 by severity of what it found.
        run: .github/scripts/advisory.sh zizmor 1 zizmor --no-exit-codes .github

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          cache: false # decision 35
      - name: Install tflint
        run: |
          # renovate: datasource=go depName=github.com/terraform-linters/tflint
          GOBIN="$RUNNER_TEMP/bin" go install github.com/terraform-linters/tflint@v0.66.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: tflint
        working-directory: infrastructure
        run: ../.github/scripts/advisory.sh tflint 2 tflint --recursive
      - name: trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          # Advisory: report, never fail.
          exit-code: '0'

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the backend image
        run: docker build -t backend:scan services/backend
      - name: trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backend:scan
          # Advisory: report, never fail.
          exit-code: '0'

  secrets:
    needs: changes
    if: needs.changes.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          cache: false # decision 35
      - name: Install gitleaks
        run: |
          # renovate: datasource=go depName=github.com/zricethezav/gitleaks/v8
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A PR is scanned for what it adds; main, in full. --exit-code 2 keeps "found a leak"
          # apart from the tool failing, which exits 1.
          range=()
          if [ "$EVENT" = pull_request ]; then range=(--log-opts "origin/main..HEAD"); fi
          .github/scripts/advisory.sh gitleaks 2 gitleaks detect --no-banner --redact --exit-code 2 "${range[@]}"
