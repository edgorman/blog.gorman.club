name: 'Terraform Push Commit'
description: 'Performs terraform init, then plans and applies in the same job'

inputs:
  terraform_directory:
    description: 'The directory containing the Terraform files'
    required: true
  config_directory:
    description: 'The directory containing the configuration files (backend and vars)'
    required: true
  secrets:
    description: 'Newline-separated list of secrets or env vars to export (e.g., KEY=VALUE)'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # Passed through the environment rather than interpolated; see terraform-pull-request.
    - name: Export Secrets
      shell: bash
      env:
        SECRETS: ${{ inputs.secrets }}
      run: |
        if [ -n "$SECRETS" ]; then
          printf '%s\n' "$SECRETS" >> "$GITHUB_ENV"
        fi

    # The version comes from .prototools, the one place it is pinned, so it can't drift from it.
    - id: terraform-version
      name: Read the Terraform version
      shell: bash
      run: echo "version=$(sed -n 's/^terraform = "\([^"]*\)".*/\1/p' .prototools | head -1)" >> "$GITHUB_OUTPUT"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
        # The wrapper re-prints stdout for step outputs nothing here reads; off so the JSON piped
        # to jq below is only Terraform's.
        terraform_wrapper: false

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      run: |
        terraform init \
          -backend-config="${{ github.workspace }}/${{ inputs.config_directory }}/terraform.tfbackend"

    # Plans and applies in this one job, so what is applied is exactly what was planned from this
    # commit: nothing is read from a plan another job wrote (decision 31). The PR showed a plan for
    # review; this one is shown in the job summary, and a plan with nothing to apply is skipped.
    - name: Terraform Plan And Apply
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      env:
        VAR_FILE: ${{ github.workspace }}/${{ inputs.config_directory }}/terraform.tfvars
      run: |
        set -o pipefail
        terraform plan -var-file="$VAR_FILE" -input=false -no-color -out=tfplan.binary
        { echo '```hcl'; terraform show -no-color tfplan.binary; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        if [ "$(terraform show -json tfplan.binary | jq '.applyable != false')" = false ]; then
          echo 'Nothing to apply.'
          exit 0
        fi
        terraform apply -input=false tfplan.binary
