$schema: '../../.moon/cache/schemas/project.json'
language: 'typescript'
layer: 'application'
stack: 'frontend'
tags: ['typescript']
# Full source path, not 'api' - the workspace uses globFormat: 'source-path'.
dependsOn: ['packages/api']

# .moon/toolchains.yml never enables the typescript toolchain workspace-wide (its sync rewrites
# tsconfig project references, and these tsconfigs are hand-maintained) - restated here so this
# project stays safe even if that ever changes elsewhere in the workspace.
toolchains:
  typescript: false
# moon's own dependency install is disabled workspace-wide (.moon/toolchains.yml's `javascript`
# entry, the only place that setting is read), so `install` below is the one `npm ci` every task
# depends on.

fileGroups:
  sources: ['src/**/*', 'public/**/*', 'worker/**/*', 'e2e/**/*', 'index.html', 'vite.config.ts', 'playwright.config.ts', 'wrangler.jsonc']
  configs: ['package.json', 'package-lock.json', 'tsconfig*.json', '.oxlintrc.json']

tasks:
  install:
    command: 'npm ci'
    inputs: ['package.json', 'package-lock.json']
    options:
      internal: true
  lint:
    command: 'npm run lint'
    deps: ['install']
    inputs: ['@group(sources)', '@group(configs)']
  typecheck:
    command: 'npx tsc -b'
    deps: ['install']
    inputs: ['@group(sources)', '@group(configs)']
  test:
    command: 'npm test'
    deps: ['install']
    # An external project input, not a dependsOn/-g relation: v2 --affected doesn't follow graph
    # relations by default, and a spec-only edit must still mark this task affected (decision 19).
    inputs: ['@group(sources)', '@group(configs)', 'project://packages/api']
  build:
    command: 'npm run build'
    deps: ['install']
    inputs: ['@group(sources)', '@group(configs)']
    # The whole folder, not a glob - moon deletes files under `outputs` that don't match on
    # cache hydration, and narrowing this would make a hydrated build lose files vite wrote.
    outputs: ['dist']
  dev:
    command: 'npm run dev'
    deps: ['install']
    preset: 'server'
  # A marker task, like the deploy-*:plan ones: its 'inputs' decide whether a merge rebuilds the
  # bundle or reuses the last release's (push-commit.yaml's `changed` job, decision 33).
  publish:
    command: 'noop'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '/.github/actions/frontend-build/**/*'
      - '/.github/actions/frontend-publish/**/*'
    options:
      # Not runInCI: false - see infrastructure/config/root/moon.yml's comment: excluding it from CI
      # hides it from moon query affected's CI-mode results, which push-commit's `changed` reads.
      cache: false

  # Marker for security.yaml's frontend job: npm audit reads the lockfile and the API types.
  scan:
    command: 'noop'
    inputs:
      - '@group(configs)'
      - 'project://packages/api'
      - '/.github/workflows/security.yaml'
      - '/.github/scripts/advisory.sh'
    options:
      # Not runInCI: false: a noop task is harmless to execute, and excluding it from CI would hide it
      # from moon query affected's CI-mode results, which the workflows' `changed` jobs read.
      cache: false
