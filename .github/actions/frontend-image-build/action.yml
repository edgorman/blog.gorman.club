name: 'Frontend Image Build'
description: 'Builds the frontend image and pushes it to Artifact Registry tagged with the commit SHA and latest'

inputs:
  gcp_project_id:
    description: 'GCP project the Artifact Registry repository lives in'
    required: true
  gcp_region:
    description: 'GCP region of the Artifact Registry repository'
    required: true
  image_tag:
    description: 'Tag to push the image under - the commit SHA, per the Staging Deployments section of CLAUDE.md'
    required: true
  backend_url:
    description: 'Base URL of the backend service, baked in at build time as VITE_BACKEND_URL'
    required: false
    default: ''
  google_client_id:
    description: 'Google OAuth 2.0 client ID, baked in as VITE_GOOGLE_CLIENT_ID. Not a secret - it identifies the app.'
    required: false
    default: ''
  workload_identity_provider:
    description: 'The Workload Identity Provider resource name'
    required: true
  service_account:
    description: 'The Google Service Account email'
    required: true

outputs:
  image_ref:
    description: 'Full reference of the pushed image, tagged with image_tag'
    value: ${{ steps.image.outputs.ref }}

runs:
  using: "composite"
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

    - name: Configure Docker Auth
      shell: bash
      run: gcloud auth configure-docker "${{ inputs.gcp_region }}-docker.pkg.dev" --quiet

    - id: image
      shell: bash
      run: |
        echo "repo=${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project_id }}/frontend/frontend" >> "$GITHUB_OUTPUT"
        echo "ref=${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project_id }}/frontend/frontend:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

    # `latest` is a floating pointer to what's on staging; nothing promotes from it.
    - name: Build Image
      shell: bash
      run: |
        docker build \
          --build-arg VITE_BACKEND_URL="${{ inputs.backend_url }}" \
          --build-arg VITE_GOOGLE_CLIENT_ID="${{ inputs.google_client_id }}" \
          -t "${{ steps.image.outputs.ref }}" \
          -t "${{ steps.image.outputs.repo }}:latest" \
          services/frontend

    - name: Push Image
      shell: bash
      run: docker push --all-tags "${{ steps.image.outputs.repo }}"
