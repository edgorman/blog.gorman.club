name: 'GCP Image Promote'
description: 'Copies a container image by digest between Artifact Registry repositories using gcrane, without rebuilding'

inputs:
  workload_identity_provider:
    description: 'The Workload Identity Provider resource name'
    required: true
  service_account:
    description: 'The Google Service Account email'
    required: true
  source_image:
    description: 'Fully-qualified source image reference, e.g. HOST/PROJECT/REPO/IMAGE:TAG'
    required: true
  dest_image:
    description: 'Fully-qualified destination image reference'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Install gcrane
      shell: bash
      run: go install github.com/google/go-containerregistry/cmd/gcrane@latest

    - name: Promote Image
      shell: bash
      run: gcrane cp "${{ inputs.source_image }}" "${{ inputs.dest_image }}"
