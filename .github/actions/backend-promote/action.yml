name: 'Backend Promote'
description: 'Copies the backend image from staging Artifact Registry into production by digest, retagged with the release version, and deploys it to Cloud Run'

inputs:
  staging_project_id:
    description: 'GCP project holding the source (staging) Artifact Registry repository'
    required: true
  prod_project_id:
    description: 'GCP project the production Artifact Registry repository and Cloud Run service live in'
    required: true
  gcp_region:
    description: 'GCP region of both Artifact Registry repositories and the Cloud Run service'
    required: true
  staging_service_name:
    description: 'Staging Cloud Run service name to read the currently-live image from (e.g. backend-stag)'
    required: true
  prod_service_name:
    description: 'Production Cloud Run service name to deploy to (e.g. backend-prod)'
    required: true
  target_tag:
    description: 'Tag to give the promoted image in production - the formal release version (e.g. v1.0.0)'
    required: true
  workload_identity_provider:
    description: 'The Workload Identity Provider resource name'
    required: true
  service_account:
    description: 'The Google Service Account email'
    required: true

outputs:
  backend_url:
    description: 'Public URL of the deployed Cloud Run service'
    value: ${{ steps.url.outputs.backend_url }}

runs:
  using: "composite"
  steps:
    - id: auth
      name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    # gcrane authenticates using the Application Default Credentials file
    # google-github-actions/auth wrote above - no separate `docker login` /
    # `gcrane auth` step needed.
    - name: Install gcrane
      shell: bash
      run: go install github.com/google/go-containerregistry/cmd/gcrane@latest

    # The staging image is promoted by whatever is actually deployed right
    # now, not by tagging convention: services-backend only pushes a
    # commit-SHA-tagged image when a push touches backend-related files
    # (see the services-backend diff filter in push-commit.yaml), so a
    # release cut from a commit that didn't (e.g. an infra-only change)
    # would have no image under that SHA at all, even though staging is
    # still happily running the last one that was actually built.
    - id: staging_image
      name: Resolve Staging Image
      shell: bash
      run: |
        DESCRIBE_ARGS=(
          "${{ inputs.staging_service_name }}"
          --region="${{ inputs.gcp_region }}"
          --project="${{ inputs.staging_project_id }}"
        )
        # gcloud has described Cloud Run services under the legacy
        # Knative-shaped `spec.template...` path for years regardless of
        # which API version actually created the resource; fall back to the
        # v2 API's own `template...` shape in case a future gcloud version
        # changes that.
        IMAGE=$(gcloud run services describe "${DESCRIBE_ARGS[@]}" \
          --format='value(spec.template.spec.containers[0].image)')
        if [ -z "$IMAGE" ]; then
          IMAGE=$(gcloud run services describe "${DESCRIBE_ARGS[@]}" \
            --format='value(template.containers[0].image)')
        fi
        if [ -z "$IMAGE" ]; then
          echo "::error::Could not resolve the currently deployed image for ${{ inputs.staging_service_name }}"
          exit 1
        fi
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

    # Copies by digest rather than rebuilding, per the Production Releases
    # section of CLAUDE.md - production runs the identical bytes already
    # validated in staging.
    - name: Promote Image
      shell: bash
      run: |
        "$(go env GOPATH)/bin/gcrane" cp \
          "${{ steps.staging_image.outputs.image }}" \
          "${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.prod_project_id }}/backend/backend:${{ inputs.target_tag }}"

    - name: Deploy to Cloud Run
      shell: bash
      run: |
        gcloud run deploy "${{ inputs.prod_service_name }}" \
          --image="${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.prod_project_id }}/backend/backend:${{ inputs.target_tag }}" \
          --region="${{ inputs.gcp_region }}" \
          --project="${{ inputs.prod_project_id }}" \
          --quiet

    - id: url
      name: Get Backend URL
      shell: bash
      run: |
        URL=$(gcloud run services describe "${{ inputs.prod_service_name }}" \
          --region="${{ inputs.gcp_region }}" \
          --project="${{ inputs.prod_project_id }}" \
          --format='value(status.url)')
        echo "backend_url=$URL" >> "$GITHUB_OUTPUT"
