name: 'Frontend Deploy'
description: 'Deploys an already-built frontend to Cloudflare Pages'

inputs:
  secrets:
    description: 'Newline-separated CLOUDFLARE_API_TOKEN=... / CLOUDFLARE_ACCOUNT_ID=... pairs (see gcp-secret-manager)'
    required: true
  cloudflare_project_name:
    description: 'Cloudflare Pages project name'
    required: true
  dist_directory:
    description: 'Directory of already-built static files to deploy, relative to services/frontend'
    required: false
    default: 'dist'
  backend_url:
    description: 'Base URL of the backend service, written into config.json for the app to read at runtime (see CLAUDE.md). Omit to deploy the build unmodified.'
    required: false
    default: ''
  version:
    description: 'Release tag written into config.json for the app to display and link to its GitHub release (see CLAUDE.md and issue #152) - on staging, the tag this commit is about to become (see push-commit.yaml''s "version" job), on production the tag actually promoted. Omit to leave it out of config.json.'
    required: false
    default: ''
  environment:
    description: 'Environment name written into config.json - "staging" or "production" (see CLAUDE.md and issue #152). Omit to leave it out of config.json.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    # Passed through the environment rather than interpolated; see terraform-pull-request.
    - name: Export Secrets
      shell: bash
      env:
        SECRETS: ${{ inputs.secrets }}
      run: printf '%s\n' "$SECRETS" >> "$GITHUB_ENV"

    # Written next to the static files rather than baked into the image, so one build can serve
    # any environment - see the Read the backend URL at runtime issue and src/lib/config.ts. Empty
    # inputs are dropped (with_entries(select)) rather than written as "", matching how
    # src/lib/config.ts already treats a missing field and an empty one the same way.
    - name: Write Runtime Config
      if: inputs.backend_url != '' || inputs.version != '' || inputs.environment != ''
      shell: bash
      env:
        BACKEND_URL: ${{ inputs.backend_url }}
        VERSION: ${{ inputs.version }}
        ENVIRONMENT: ${{ inputs.environment }}
        CONFIG_PATH: services/frontend/${{ inputs.dist_directory }}/config.json
      run: |
        jq -n \
          --arg backendUrl "$BACKEND_URL" \
          --arg version "$VERSION" \
          --arg environment "$ENVIRONMENT" \
          '{backendUrl: $backendUrl, version: $version, environment: $environment} | with_entries(select(.value != ""))' \
          > "$CONFIG_PATH"

    # --branch=main is required: wrangler infers production vs. preview from GITHUB_REF_NAME, which
    # is the release tag on a `release` event, and would silently deploy as Preview.
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
      with:
        apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: services/frontend
        command: pages deploy ${{ inputs.dist_directory }} --project-name=${{ inputs.cloudflare_project_name }} --branch=main
