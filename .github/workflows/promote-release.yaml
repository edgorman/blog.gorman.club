name: 'Promote Release'

# Deploys a release to production from the commit-SHA artifacts already in prod's own stores:
# push-release.yaml calls it when release-please cuts a release, and it is run by hand to roll back
# (or finish a failed promotion) with an earlier release tag. Nothing is rebuilt (decisions 22, 39).
on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag being deployed, e.g. v1.2.3'
        type: string
        required: true
      sha:
        description: 'The commit the tag points at'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy, e.g. v1.2.3 - the latest to promote, an earlier one to roll back'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: promote-release-main
  cancel-in-progress: false

jobs:
  # Resolves what is being deployed; a manual run names only the tag.
  target:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: target
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag (vMAJOR.MINOR.PATCH)."; exit 1; }
          sha="${SHA:-$(git rev-list -n 1 "refs/tags/$TAG")}"
          test -n "$sha" || { echo "::error::No commit for tag $TAG."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Step 1: infra applies before any service is touched, re-planned in the job (decision 37).
  infrastructure-prod:
    needs: target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.target.outputs.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
        env:
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_ci_service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}

  # Step 2: deploy the commit-SHA image already in prod's registry. It reads nothing from staging.
  services-backend:
    needs: [target, infrastructure-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_url: ${{ steps.deploy.outputs.backend_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.target.outputs.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # The release-<version> tag is for retention only (decision 29); the deploy goes by commit SHA.
      - name: Tag the image with its release
        env:
          IMAGE: 'europe-west1-docker.pkg.dev/blog-gorman-club-prod/backend/backend'
          RELEASE: ${{ needs.target.outputs.tag }}
          SHA: ${{ needs.target.outputs.sha }}
        run: gcloud artifacts docker tags add "$IMAGE:$SHA" "$IMAGE:release-$RELEASE" --quiet
      - id: deploy
        uses: ./.github/actions/backend-cloudrun-deploy
        with:
          gcp_project_id: 'blog-gorman-club-prod'
          gcp_region: 'europe-west1'
          service_name: 'backend-prod'
          image: 'europe-west1-docker.pkg.dev/blog-gorman-club-prod/backend/backend:${{ needs.target.outputs.sha }}'

  # Step 2, alongside the backend: the worker's commit-SHA image, already in prod's registry the same way.
  services-worker:
    needs: [target, infrastructure-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.target.outputs.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Tag the image with its release
        env:
          IMAGE: 'europe-west1-docker.pkg.dev/blog-gorman-club-prod/backend/worker'
          RELEASE: ${{ needs.target.outputs.tag }}
          SHA: ${{ needs.target.outputs.sha }}
        run: gcloud artifacts docker tags add "$IMAGE:$SHA" "$IMAGE:release-$RELEASE" --quiet
      - uses: ./.github/actions/backend-cloudrun-deploy
        with:
          gcp_project_id: 'blog-gorman-club-prod'
          gcp_region: 'europe-west1'
          service_name: 'worker-prod'
          image: 'europe-west1-docker.pkg.dev/blog-gorman-club-prod/backend/worker:${{ needs.target.outputs.sha }}'

  # Step 3: fetch the commit-SHA folder from prod's own bucket and deploy it, with config.json
  # written from the just-promoted backend URL.
  services-frontend:
    needs: [target, infrastructure-prod, services-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.target.outputs.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            cloudflare_api_token: projects/blog-gorman-club-root/secrets/cloudflare_api_token/versions/latest
      - uses: ./.github/actions/frontend-fetch
        with:
          gcp_project_id: 'blog-gorman-club-prod'
          sha: ${{ needs.target.outputs.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-deploy
        with:
          cloudflare_api_token: ${{ steps.secrets.outputs.cloudflare_api_token }}
          cloudflare_project_name: 'frontend-prod'
          cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          backend_url: ${{ needs.services-backend.outputs.backend_url }}
          version: ${{ needs.target.outputs.tag }}
          environment: 'production'
