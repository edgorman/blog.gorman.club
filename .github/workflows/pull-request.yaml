name: 'Pull Request'

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pull-request-root-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.diff.outputs.infrastructure-root }}
      services-frontend: ${{ steps.diff.outputs.services-frontend }}
      services-backend: ${{ steps.diff.outputs.services-backend }}
      infrastructure-staging: ${{ steps.diff.outputs.infrastructure-staging }}
      infrastructure-prod: ${{ steps.diff.outputs.infrastructure-prod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: diff
        uses: ./.github/actions/github-file-diff
        with:
          branch_ref: ${{ github.base_ref }}

  services-frontend:
    needs: diff
    if: needs.diff.outputs.services-frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/frontend-test

  # Runs alongside services-frontend rather than replacing it - advisory only, nothing depends on
  # it passing yet. See CLAUDE.md's "Building with Pants" note and #110.
  services-frontend-pants:
    needs: diff
    if: needs.diff.outputs.services-frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/typescript-pants
        with:
          package-lock-path: services/frontend/package-lock.json
          pants-target: 'services/frontend::'
      # Proves the node_build_script target (#119) produces a bundle, using the exact command the
      # acceptance criteria names. Advisory only, same as the step above: nothing publishes the
      # result and nothing depends on it - frontend-build/action.yml remains the publish path.
      - name: Package
        shell: bash
        run: pants package 'services/frontend::'

  services-backend:
    needs: diff
    if: needs.diff.outputs.services-backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/backend-test

  # Runs alongside services-backend rather than replacing it - advisory only, nothing depends on
  # it passing yet. See CLAUDE.md's "Building with Pants" note and #110.
  services-backend-pants:
    needs: diff
    if: needs.diff.outputs.services-backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/golang-pants
        with:
          go-mod-path: services/backend/go.mod
          pants-target: 'services/backend::'
      # Proves the docker_image target (#117) produces an image, using the exact command its
      # acceptance criteria names. Advisory only, same as the step above: nothing publishes the
      # result and nothing depends on it - backend-deploy/action.yml remains the deploy path.
      - name: Package Docker Image
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: pants package 'services/backend::'

  infrastructure-root:
    needs: diff
    if: needs.diff.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
            TF_VAR_cloudflare_account_id=cloudflare_account_id
            TF_VAR_cloudflare_api_token=cloudflare_api_token
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Runs alongside the infrastructure-{root,staging,prod} plan jobs below rather than replacing
  # them - advisory only, nothing depends on it passing yet. See CLAUDE.md's "Building with Pants"
  # note and #110. Unlike those jobs, `pants check` (`terraform validate`) needs no cloud auth: it
  # doesn't touch state or a real backend, so it runs once for the whole infrastructure/ tree
  # rather than once per environment.
  infrastructure-pants:
    needs: diff
    if: |
      needs.diff.outputs.infrastructure-root == 'true' ||
      needs.diff.outputs.infrastructure-staging == 'true' ||
      needs.diff.outputs.infrastructure-prod == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pantsbuild/actions/init-pants@0aaef864bd133c4055feb6adad0bfdce0de1c2e4 # v11
        with:
          gha-cache-key: v0-terraform
          # The Terraform backend has no named caches to key on.
          named-caches-hash: ''
          cache-lmdb-store: 'true'
      - name: Check
        shell: bash
        run: |
          pants check infrastructure::

  # infrastructure/env/** is shared, so a change to it plans against both environments.
  infrastructure-staging:
    needs: diff
    if: needs.diff.outputs.infrastructure-staging == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/staging'
          # One client ID, defined in infrastructure/root, serves every environment.
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  infrastructure-prod:
    needs: diff
    if: needs.diff.outputs.infrastructure-prod == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          # One client ID, defined in infrastructure/root, serves every environment.
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
