# This file is synced to GitHub by https://github.com/repository-settings/app
#
# Repository settings, branch protection, and labels are managed declaratively
# from here. Edit this file (via a pull request) rather than changing settings
# by hand in the GitHub UI — manual changes will be reverted on the next sync.

repository:
  # General
  name: blog.gorman.club
  description: The blog subdomain for the gorman.club website.
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: false

  default_branch: main

  # Merge button behaviour — squash-only keeps trunk history linear, which the
  # pre-release/release tagging strategy in .github/AGENTS.md depends on.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  delete_branch_on_merge: true

  # Security
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

labels:
  - name: infrastructure
    color: "1d76db"
    description: Terraform / infrastructure changes
  - name: backend
    color: "0e8a16"
    description: Backend service changes
  - name: frontend
    color: "fbca04"
    description: Frontend changes
  - name: ci
    color: "5319e7"
    description: GitHub Actions / workflow changes
  - name: release
    color: "0052cc"
    description: Related to a pre-release or production release

branches:
  - name: main
    protection:
      # No required review count: CODEOWNERS names only @edgorman as owner
      # of everything, and GitHub never counts a PR author's own review as
      # satisfying a review requirement - so with required_approving_review_count
      # at 1 and require_code_owner_reviews true, every PR from the sole
      # maintainer was unapprovable by construction (self-review doesn't
      # count, and there's no second collaborator to approve it). This repo
      # is user-owned rather than org-owned, so `bypass_pull_request_allowances`
      # (letting a named user skip required reviews while everyone else still
      # needs one) isn't available here - GitHub restricts that field to
      # org-owned repos. Status checks, linear history, and conversation
      # resolution below still gate every merge; only the human-approval gate
      # is dropped. Add required_pull_request_reviews back (with
      # bypass_pull_request_allowances for @edgorman) if this repo ever moves
      # under an org, or gets a second collaborator to actually review.

      # The jobs of .github/workflows/pull-request.yaml, named by their job ids
      # (none of them set a `name:`, so that is what the check run is called).
      #
      # Every one of these is safe to require even though most are conditional
      # on what the PR touched: the workflow itself has no path filter, so it
      # runs on every PR to main, and a job its `if:` skips still reports a
      # check run - with conclusion "skipped", which branch protection counts
      # as passing. It is a workflow that never runs at all that leaves a
      # required check pending forever, and this one always runs.
      required_status_checks:
        strict: true
        contexts:
          - changed
          - lint-check
          - test
          - protos-drift
          - infrastructure-root
          - infrastructure-staging
          - infrastructure-prod

      enforce_admins: false
      required_linear_history: true
      required_conversation_resolution: true
      restrictions: null
      allow_force_pushes: false
      allow_deletions: false
