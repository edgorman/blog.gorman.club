name: 'Push Commit'

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: push-commit-root-main
  cancel-in-progress: false

jobs:
  # Computed once, early - a read-only calculation, unlike actually cutting the tag/release, which
  # still waits on services-backend/services-frontend below (see pre-release's own comment) so a
  # tag is never cut for a commit those publish jobs failed to build for. Reused by both
  # services-frontend (to show the release tag this commit is about to become, rather than a raw
  # commit SHA that says nothing about it) and pre-release (to cut that same tag), so the two never
  # disagree about what this commit's version is.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Reads Conventional Commit subjects (see AGENTS.md) from the squash-merge history on `main`
      # to pick the bump: a bare `feat:` is minor, `!` or a `BREAKING CHANGE:` footer is major,
      # anything else (`fix:`, `chore:`, ...) is patch - same fallback as the old always-patch logic.
      - id: version
        name: Calculate Next Version
        uses: Fresa/trunk-based-release-versioning@8b8150e3258028d42d7a8d30aec43491f5794d9e # v0.2.0

  # Decides which Terraform deployment(s) an apply reaches, the same way pull-request.yaml's
  # `changed` job decides which to plan: Pants' own dependency graph
  # (infrastructure/config/*/BUILD) rather than a hand-maintained glob, with a small `.github/**`
  # filter layered on top for the one thing Pants can't see - a composite action. There is no
  # services-frontend/services-backend output here: those jobs below publish artifacts on every
  # merge unconditionally (see the comment on services-frontend), so nothing gates them.
  changed:
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.combine.outputs.infrastructure-root }}
      infrastructure-staging: ${{ steps.combine.outputs.infrastructure-staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # --changed-since=${{ github.event.before }} needs that commit to actually be present
          # locally.
          fetch-depth: 0
      - id: github-diff
        uses: ./.github/actions/github-file-diff
        with:
          branch_ref: ${{ github.ref_name }}
      - id: pants
        uses: ./.github/actions/pants-changed
        with:
          since: ${{ github.event.before }}
      - id: combine
        shell: bash
        run: |
          combine() {
            if [ "$1" = 'true' ] || [ "${{ steps.github-diff.outputs.github-actions }}" = 'true' ]; then
              echo true
            else
              echo false
            fi
          }
          echo "infrastructure-root=$(combine '${{ steps.pants.outputs.infrastructure-root }}')" >> "$GITHUB_OUTPUT"
          echo "infrastructure-staging=$(combine '${{ steps.pants.outputs.infrastructure-staging }}')" >> "$GITHUB_OUTPUT"

  # #198: moon runs alongside Pants, advisory-only - neither job below is in settings.yml's
  # required_status_checks, so a moon failure or mismatch never blocks anything on `main`. See
  # pull-request.yaml's identical pair for why each is built the way it is; the one difference here
  # is the base ref.
  #
  # `${{ github.event.before }}` is the pre-push SHA, the same ref `changed`'s pants-changed step
  # above already diffs against - but unlike that step (which asks Pants to resolve the ref itself),
  # `moon ci`'s --base needs a ref this checkout can actually reach. On the very first push to a new
  # ref, `before` is 40 zeros; after a force-push, it can name a commit this history no longer
  # contains (rewritten away). Both are detected here and fail open (`--force`, i.e. run
  # unconditionally rather than let `moon ci` error trying to resolve an unreachable ref) - the
  # issue's own suggested handling, and this repo's branch protection (`allow_force_pushes: false`,
  # settings.yml) plus squash-merge-only history means the force-push case shouldn't occur in
  # practice, but it costs nothing to handle.
  moon-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      - name: moon ci
        shell: bash
        run: |
          before='${{ github.event.before }}'
          if [ "$before" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "$before" 2>/dev/null; then
            moon ci --force
          else
            MOON_BASE="$before" moon ci
          fi

  # Same three-environment parity check as pull-request.yaml's moon-changed, but against push-commit's
  # own `changed` job (root + staging only - prod is never planned/applied here, see Production
  # Releases in .github/AGENTS.md) and the pre-push SHA rather than origin/main.
  moon-changed:
    needs: changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      - id: moon
        name: Compute moon-affected deployments
        shell: bash
        run: |
          before='${{ github.event.before }}'
          if [ "$before" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "$before" 2>/dev/null; then
            # Same fail-open the moon-ci step above takes: nothing to diff against, so every
            # deployment is treated as affected rather than guessed at.
            echo 'root=true' >> "$GITHUB_OUTPUT"
            echo 'staging=true' >> "$GITHUB_OUTPUT"
          else
            # moon query affected has no --base of its own (see pull-request.yaml's moon-changed for
            # why); on `main` itself it falls back to comparing against the previous revision
            # (HEAD~1) instead, which is exactly $before here since every merge to main is a single
            # squash commit (AGENTS.md's Commit Message Convention) - never a --base override, but
            # correct for how this repo actually pushes.
            moon query affected > affected.json
            for env in root staging; do
              val=$(jq -r --arg t "deploy-$env:plan" '(.tasks // {}) | has($t)' affected.json)
              echo "$env=$val" >> "$GITHUB_OUTPUT"
            done
          fi
      - name: Compare against Pants
        shell: bash
        env:
          PANTS_ROOT: ${{ needs.changed.outputs.infrastructure-root }}
          PANTS_STAGING: ${{ needs.changed.outputs.infrastructure-staging }}
          MOON_ROOT: ${{ steps.moon.outputs.root }}
          MOON_STAGING: ${{ steps.moon.outputs.staging }}
        run: |
          {
            echo '### moon vs Pants: infrastructure affectedness'
            echo
            echo '| Environment | Pants (+ github-diff) | moon | Match |'
            echo '|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          mismatch=0
          for env in root staging; do
            pants_var="PANTS_${env^^}"
            moon_var="MOON_${env^^}"
            pants_val="${!pants_var}"
            moon_val="${!moon_var}"
            if [ "$pants_val" = "$moon_val" ]; then
              match='✅'
            else
              match='❌'
              mismatch=1
              echo "::warning::moon/Pants mismatch for infrastructure-$env: Pants(+github-diff)=$pants_val moon=$moon_val - see #198's parity table for expected divergence (e.g. a .github/** change outside terraform/secret actions or workflows)."
            fi
            echo "| infrastructure-$env | $pants_val | $moon_val | $match |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$mismatch" = '1' ]; then
            echo
            echo '_See #198 for which divergences are expected (moon dropping the blanket `.github/**` glob) vs a real gap to investigate._' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

  # Runs on every merge - not gated on the services-frontend diff - so every commit on `main`, and
  # therefore every release tag, has a folder in both buckets. One build feeds both buckets and
  # Cloudflare Pages, so the live staging site is never rebuilt separately from what's stored.
  services-frontend:
    needs: [changed, infrastructure-root, infrastructure-staging, services-backend, version]
    if: |
      always() &&
      needs.changed.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped') &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped') &&
      (needs.services-backend.result == 'success' || needs.services-backend.result == 'skipped') &&
      needs.version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
            CLOUDFLARE_ACCOUNT_ID=cloudflare_account_id
      # Looked up directly (reusing gcp-secret-manager's auth) since services-backend's output is
      # unavailable when that job is skipped.
      - id: backend
        name: Get Backend URL
        shell: bash
        run: |
          URL=$(gcloud run services describe backend-stag \
            --region=europe-west1 \
            --project=blog-gorman-club-stag \
            --format='value(status.url)' 2>/dev/null || true)
          echo "backend_url=$URL" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/frontend-build
        with:
          google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: ./.github/actions/frontend-publish
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          prod_project_id: 'blog-gorman-club-prod'
          sha: ${{ github.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: 'frontend-stag'
          backend_url: ${{ steps.backend.outputs.backend_url }}
          # The exact tag pre-release (below) will cut for this commit - computed once by the
          # version job above and reused here, rather than each recomputing it, so the two never
          # disagree about what tag this commit becomes.
          version: v${{ needs.version.outputs.version }}
          environment: 'staging'

  infrastructure-root:
    needs: changed
    if: needs.changed.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
            TF_VAR_cloudflare_account_id=cloudflare_account_id
            TF_VAR_cloudflare_api_token=cloudflare_api_token
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}

  # Waits on infrastructure-root so any IAM grants or API enablement it applies land first.
  infrastructure-staging:
    needs: [changed, infrastructure-root]
    if: |
      always() &&
      needs.changed.outputs.infrastructure-staging == 'true' &&
      needs.changed.result == 'success' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/staging'
          # One client ID, defined in infrastructure/root, serves every environment.
          secrets: |
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}

  # Runs on every merge - not gated on the services-backend diff - so every commit on `main`, and
  # therefore every release tag, has a commit-SHA image in both registries. Must still follow
  # infrastructure-staging so the staging deploy target exists.
  services-backend:
    needs: [changed, infrastructure-staging]
    if: |
      always() &&
      needs.changed.result == 'success' &&
      (needs.infrastructure-staging.result == 'success' || needs.infrastructure-staging.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/backend-deploy
        with:
          gcp_project_id: 'blog-gorman-club-stag'
          prod_project_id: 'blog-gorman-club-prod'
          gcp_region: 'europe-west1'
          service_name: 'backend-stag'
          image_tag: ${{ github.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

  # Runs on every merge, since the pre-release isn't gated on what changed - it waits on the publish
  # jobs having actually published instead, so a tag never exists without a commit-SHA image and
  # frontend folder behind it in both environments (the one failure promotion can't recover from:
  # nothing to deploy, nothing to roll back to).
  #
  # `if:` explicitly checks only this job's own direct needs (#185). A bare `needs:` with no `if:`
  # looks equivalent - GitHub's default condition is "run only if every dependency succeeded" - but
  # GitHub's default success() check isn't limited to direct needs: it's defeated by a `skipped`
  # conclusion anywhere upstream in the needs graph, including two hops back through
  # infrastructure-root/infrastructure-staging (which skip on almost every merge, since most commits
  # touch neither infrastructure/** nor .github/**) even though services-backend/services-frontend
  # each already override their own `if:` to tolerate exactly that skip. The result: pre-release
  # silently skipped on nearly every merge, while services-frontend had already written that merge's
  # speculative next version into staging's config.json - a version with no release ever cut for it.
  # always() opts out of that default short-circuit, matching the pattern services-frontend already
  # uses above; the explicit `== 'success'` (not `'success' || 'skipped'`) keeps the fix #156 made -
  # neither publish job has a benign skip path, so a skip of either here is still not tag-worthy.
  pre-release:
    needs: [services-backend, services-frontend, version]
    if: |
      always() &&
      needs.services-backend.result == 'success' &&
      needs.services-frontend.result == 'success' &&
      needs.version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Recomputed rather than reused from the version job above only because `last-version` and
      # `commit-logs-path` (below, for the release notes) aren't carried by that job's output - a
      # job output is a string, not the file this action also writes. The tag itself is NOT taken
      # from here (see Create Pre-Release below): both invocations read the same commit history and
      # existing tags, so they agree in practice, but the version job's output is the one already
      # shown in the frontend, and is what this release is actually cut under.
      - id: version
        name: Calculate Next Version
        uses: Fresa/trunk-based-release-versioning@8b8150e3258028d42d7a8d30aec43491f5794d9e # v0.2.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"

      - name: Terraform Plan (prod preview)
        shell: bash
        working-directory: infrastructure/env
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/infrastructure/config/prod/terraform.tfbackend"
          terraform plan \
            -var-file="${{ github.workspace }}/infrastructure/config/prod/terraform.tfvars" \
            -lock=false \
            -no-color \
            -input=false \
            -out=tfplan.binary
          terraform show -no-color tfplan.binary > tfplan.txt

      - name: Write Release Notes
        shell: bash
        run: |
          {
            echo "## Commits since v${{ steps.version.outputs.last-version || '0.0.0' }}"
            echo
            # commit-logs-path holds one "hash: <H>\nmessage: | \n <subject>\n <body...>" record per
            # commit, separated by "---"; pull just the subject (record line 3, minus its 1-space
            # indent) so each commit renders as a normal markdown bullet instead of raw commit bodies.
            awk 'BEGIN { RS="\n---\n"; FS="\n" } NF>=3 { printf "- %s (%.7s)\n", substr($3,2), substr($1,7) }' \
              "${{ steps.version.outputs.commit-logs-path }}"
            echo
            echo "### Terraform Plan for \`prod\` Environment"
            echo
            echo "<details>"
            echo "<summary>Show Plan</summary>"
            echo
            echo '```hcl'
            cat infrastructure/env/tfplan.txt
            echo '```'
            echo
            echo "</details>"
          } > RELEASE_NOTES.md

      - name: Create Pre-Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # From the version job above, not the local recompute two steps up (see its comment) -
          # the same tag staging's frontend already displays.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: RELEASE_NOTES.md
