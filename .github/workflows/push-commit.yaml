name: 'Push Commit'

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: push-commit-root-main
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.diff.outputs.infrastructure-root }}
    steps:
      - uses: actions/checkout@v5
      - id: diff
        uses: ./.github/actions/github-file-diff
        with:
          branch_ref: ${{ github.ref_name }}

  infrastructure-root:
    needs: diff
    if: needs.diff.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'blog-gorman-club-root'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}

  # Runs on every merge to main, independent of the diff job above: the
  # default patch-bump pre-release is unconditional per CLAUDE.md, not
  # gated on which part of the repo changed.
  pre-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: version
        name: Calculate Next Version
        shell: bash
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          {
            echo "version=v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "last_tag=$LAST_TAG"
          } >> "$GITHUB_OUTPUT"

      - id: commits
        name: Summarize Commits Since Last Release
        shell: bash
        run: |
          if git rev-parse "${{ steps.version.outputs.last_tag }}" >/dev/null 2>&1; then
            RANGE="${{ steps.version.outputs.last_tag }}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo 'log<<COMMITS_EOF'
            git log "$RANGE" --pretty='- %s (%h)'
            echo 'COMMITS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Skipped until infrastructure/config/prod exists (the env-level
      # Terraform root described in CLAUDE.md hasn't been scaffolded yet,
      # same as the staging/prod filters noted in github-file-diff) - keeps
      # every merge to main from failing here in the meantime.
      - name: Authenticate to Google Cloud
        if: hashFiles('infrastructure/config/prod/**') != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Setup Terraform
        if: hashFiles('infrastructure/config/prod/**') != ''
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Terraform Init
        if: hashFiles('infrastructure/config/prod/**') != ''
        shell: bash
        working-directory: infrastructure
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/infrastructure/config/prod/terraform.tfbackend"

      - id: plan
        name: Terraform Plan
        if: hashFiles('infrastructure/config/prod/**') != ''
        shell: bash
        working-directory: infrastructure
        run: |
          terraform plan \
            -var-file="${{ github.workspace }}/infrastructure/config/prod/terraform.tfvars" \
            -lock=false \
            -no-color \
            -out=tfplan.binary
          {
            echo 'plan<<PLAN_EOF'
            terraform show -no-color tfplan.binary
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Write Release Notes
        shell: bash
        run: |
          {
            echo "## Commits since ${{ steps.version.outputs.last_tag }}"
            echo "${{ steps.commits.outputs.log }}"
            if [ -n "${{ steps.plan.outputs.plan }}" ]; then
              echo
              echo "## Terraform Plan (blog-gorman-club-prod)"
              echo '```hcl'
              echo "${{ steps.plan.outputs.plan }}"
              echo '```'
            fi
          } > RELEASE_NOTES.md

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: RELEASE_NOTES.md
