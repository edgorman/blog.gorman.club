name: 'GitHub File Diff'
description: 'Determines whether CI configuration itself changed'

inputs:
  branch_ref:
    description: 'The branch we are generating a diff against'
    required: true

outputs:
  github-actions:
    description: 'Whether .github/** changed'
    value: ${{ steps.filter.outputs.github-actions }}

runs:
  using: "composite"
  steps:
    # Pants has no target type for composite actions, so it can't tell whether a change to e.g.
    # .github/actions/terraform-pull-request affects an environment's plan/apply the way it can
    # trace a Terraform module through infrastructure/*/BUILD. This is the one glob left standing
    # after #120 - deliberately repo-wide rather than per-action, since modelling each composite
    # action's blast radius by hand is exactly the hand-maintained map this issue retires.
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      id: filter
      with:
        base: ${{ inputs.branch_ref }}
        filters: |
          github-actions:
            - '.github/**'
