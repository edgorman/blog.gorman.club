<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gorman Club</title>
    <!-- Applied before paint so a dark-mode visitor never sees a light flash. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('gc-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Identity Services, loaded from Google rather than bundled; useGoogleAuth waits
         for this to load before initialising. -->
    <script id="google-identity-services" src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
