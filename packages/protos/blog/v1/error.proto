syntax = "proto3";

package blog.v1;

option go_package = "github.com/edgorman/blog.gorman.club/services/backend/internal/gen/blog/v1;blogv1";

// ErrorResponse is the body of every non-2xx response (internal/service/respond.go's writeError),
// unlike every other message here which belongs to one resource. It is the last hand-written wire
// shape #173 found: every handler answers a failure the same way regardless of what it was doing,
// so there is one envelope rather than one per resource, and api.ts reads it the same way it reads
// any other generated type instead of declaring its own matching interface.
//
// entity.ValidationError (the {field, message} pair a rejected write carries internally) is not
// modeled here and never will be: writeValidationError collapses it to a single string
// (entity.ValidationError.Error()) before it reaches this message, so the wire has only ever seen
// one shape, not two.
message ErrorResponse {
  string error = 1;
}
