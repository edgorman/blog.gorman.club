name: 'Backend Test'
description: 'Installs dependencies, lints, tests, and builds the backend service'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Install Dependencies
      shell: bash
      run: make -f services/backend/Makefile install

    - name: Lint
      shell: bash
      run: make -f services/backend/Makefile lint

    - name: Test
      shell: bash
      run: make -f services/backend/Makefile test

    - name: Build
      shell: bash
      run: make -f services/backend/Makefile build
