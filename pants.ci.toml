# CI-only settings, layered on top of pants.toml via PANTS_CONFIG_FILES
# (set by the pantsbuild/actions/init-pants composite action).

[GLOBAL]
dynamic_ui = false
colors = true

# init-pants' experimental-remote-cache-via-gha input points remote_store_address at the GitHub
# Actions cache service (an https:// URL), which only the experimental-github-actions-cache
# provider understands - the default `reapi` provider only accepts grpc(s)://.
remote_provider = "experimental-github-actions-cache"
remote_cache_read = true
remote_cache_write = true
