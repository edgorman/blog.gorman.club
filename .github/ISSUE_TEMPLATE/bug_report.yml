name: Bug Report
description: Report something that's broken
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - infrastructure
        - backend
        - frontend
        - ci
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: staging, production, or local
    validations:
      required: false
