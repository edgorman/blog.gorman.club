$schema: '../../../.moon/cache/schemas/project.json'
# The dependency on deploy-root is apply ordering, not a build edge - modelled here only so
# `moon project-graph` reads correctly (prod's own apply ordering lives in promote-release.yaml
# and apply-infrastructure-prod.yaml, not push-commit.yaml - prod never applies on a bare merge).
dependsOn: ['infra-env', 'deploy-root']
tags: ['deployment']

tasks:
  # Marker for pull-request.yaml's plan job: 'inputs' define what reaches this
  # environment's PR plan. Only the plan's own action and workflow are listed.
  plan:
    command: 'noop'
    inputs:
      - 'terraform.tfbackend'
      - 'terraform.tfvars'
      - 'project://infra-env'
      - '/.github/actions/terraform-pull-request/**/*'
      - '/.github/workflows/pull-request.yaml'
    options:
      # Not runInCI: false - a noop task is harmless for moon-ci to actually execute, and
      # excluding it from CI would also exclude it from moon query affected's CI-mode results
      # (#198's own moon-changed job needs to see it): moon's AffectedTracker treats
      # runInCI: false/Skip as "never affected in CI" - a real, confirmed-in-production finding
      # (crates/affected/src/task_tracker.rs's is_task_affected), not assumed.
      cache: false
